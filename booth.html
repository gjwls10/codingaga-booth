&lt;html lang=&quot;ko&quot;&gt;
&lt;head&gt;
&lt;meta charset=&quot;utf-8&quot;&gt;
&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;
&lt;title&gt;1분 투자 챌린지&lt;/title&gt;
&lt;style&gt;
/* ===== 색상 ===== */
:root {
  --bg: #070b18;
  --panel: rgba(22, 31, 58, .78);
  --panel-solid: #141c36;
  --panel2: #1c2748;
  --line: rgba(120, 150, 220, .18);
  --line-strong: rgba(120, 150, 220, .32);
  --text: #eef2fb;
  --muted: #8f9cc0;
  --accent: #ffcc33;
  --accent2: #ff9a3d;
  --up: #ff4d5e;     /* 상승 = 빨강 */
  --down: #3d8bff;   /* 하락 = 파랑 */
  --flat: #a8b0c4;
  --danger-bg: #3a1a1c;
  --practice: #3ecf8e;      /* 연습 모드 강조색 */
  --practice-bg: #12302a;
  color-scheme: dark;
}

/* ===== 공통 ===== */
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; overflow-x: hidden; }
body {
  background:
    radial-gradient(900px 500px at 15% -10%, rgba(61,139,255,.22), transparent 60%),
    radial-gradient(800px 500px at 100% 0%, rgba(255,77,94,.14), transparent 60%),
    radial-gradient(900px 600px at 50% 120%, rgba(255,204,51,.10), transparent 60%),
    var(--bg);
  background-attachment: fixed;
  color: var(--text);
  font-family: Pretendard, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, &quot;Noto Sans KR&quot;, sans-serif;
  font-size: 18px;
}
/* 뒤쪽 격자 무늬 (차트 화면 느낌) */
body::before {
  content: &quot;&quot;; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    linear-gradient(rgba(120,150,220,.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(120,150,220,.06) 1px, transparent 1px);
  background-size: 48px 48px;
  -webkit-mask-image: radial-gradient(ellipse at 50% 30%, #000 30%, transparent 80%);
  mask-image: radial-gradient(ellipse at 50% 30%, #000 30%, transparent 80%);
}
button { font: inherit; cursor: pointer; }
.wrap { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 22px 20px 40px; min-height: 100%; }
.screen { display: none; }
.screen.active { display: block; animation: fade .3s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

.up { color: var(--up); }
.down { color: var(--down); }
.flat { color: var(--flat); }

.btn {
  position: relative; overflow: hidden;
  border: 0; border-radius: 16px; padding: 16px 30px;
  background: linear-gradient(180deg, #ffe27a, var(--accent) 45%, #f0a91c);
  color: #2a1c00; font-weight: 900; font-size: 22px;
  box-shadow: 0 8px 22px rgba(255,190,50,.3), inset 0 1px 0 rgba(255,255,255,.6);
  transition: transform .15s, box-shadow .2s, filter .2s;
}
.btn::after {
  content: &quot;&quot;; position: absolute; inset: 0;
  background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.5) 50%, transparent 65%);
  transform: translateX(-120%); transition: transform .6s;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(255,190,50,.4), inset 0 1px 0 rgba(255,255,255,.6); }
.btn:hover::after { transform: translateX(120%); }
.btn.ghost {
  background: rgba(255,255,255,.04); color: var(--muted); border: 1px solid var(--line-strong);
  font-size: 15px; padding: 8px 14px; font-weight: 600; box-shadow: none;
}
.btn.ghost:hover { color: var(--text); background: rgba(255,255,255,.08); transform: none; }
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 24px;
  box-shadow: 0 18px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04);
  backdrop-filter: blur(8px);
}
.card h2 { margin: 0 0 14px; font-size: 22px; }
.center { text-align: center; margin-top: 24px; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.pill {
  background: rgba(28,39,72,.85); border: 1px solid var(--line); border-radius: 999px; padding: 8px 18px; font-weight: 700;
  backdrop-filter: blur(6px);
}
.pill b { color: var(--accent); }

/* ===== 종목 전광판 (맨 위) ===== */
.ticker {
  position: relative; z-index: 2; overflow: hidden; white-space: nowrap;
  background: linear-gradient(90deg, #0b1124, #121a35, #0b1124);
  border-bottom: 1px solid var(--line); font-size: 15px; font-weight: 700;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
  mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
}
.ticker .track { display: inline-flex; gap: 38px; padding: 9px 0; animation: tick 34s linear infinite; }
.ticker span { color: #c9d3ef; }
.ticker span i { font-style: normal; margin-left: 6px; font-size: 13px; }
.ticker span i.up { color: var(--up); } .ticker span i.down { color: var(--down); }
@keyframes tick { from { transform: translateX(0); } to { transform: translateX(-50%); } }

/* ===== 시작 화면 ===== */
.hero { position: relative; text-align: center; padding: 26px 0 8px; }
.hero .chart-bg { position: absolute; left: 50%; top: 4px; width: 760px; max-width: 100%; transform: translateX(-50%); opacity: .55; pointer-events: none; z-index: -1; }
.hero .chart-bg .line { stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: draw 3.2s ease forwards .2s; }
.hero .chart-bg .area { opacity: 0; animation: fadein 1.2s ease forwards 1.6s; }
.hero .chart-bg .dot { opacity: 0; animation: fadein .4s ease forwards 3.2s, blinkdot 1.6s ease-in-out infinite 3.6s; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fadein { to { opacity: 1; } }
@keyframes blinkdot { 50% { r: 9; opacity: .6; } }
.hero .eyebrow {
  display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 800; letter-spacing: 3px; color: var(--accent);
  padding: 6px 14px; border-radius: 999px; background: rgba(255,204,51,.08); border: 1px solid rgba(255,204,51,.3);
}
.hero .eyebrow .live { width: 8px; height: 8px; border-radius: 50%; background: var(--up); box-shadow: 0 0 10px var(--up); animation: blink 1s steps(2) infinite; }
.hero h1 { font-size: 72px; margin: 14px 0 0; letter-spacing: -2px; line-height: 1.05; text-shadow: 0 6px 30px rgba(0,0,0,.5); }
.hero h1 span {
  background: linear-gradient(90deg, #ffe27a, var(--accent), var(--accent2), #ffe27a); background-size: 200% 100%;
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: var(--accent);
  animation: shimmer 5s linear infinite;
}
@keyframes shimmer { to { background-position: -200% 0; } }
.hero p { color: #b8c3e3; font-size: 21px; margin: 14px 0 0; }
.hero p b { color: var(--accent); }
.start-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 22px; margin-top: 30px; }
.start-grid .card { animation: rise .5s ease both; }
.start-grid .card + .card { animation-delay: .1s; }
.nick-row { display: flex; gap: 10px; }
.nick-row input {
  flex: 1; min-width: 0; font: inherit; font-size: 24px; font-weight: 700; padding: 15px 18px; border-radius: 14px;
  border: 2px solid var(--line-strong); background: rgba(7,11,24,.8); color: var(--text); outline: none;
  transition: border-color .2s, box-shadow .2s;
}
.nick-row input::placeholder { color: #56618a; font-weight: 500; }
.nick-row input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(255,204,51,.15); }
.msg { color: var(--up); min-height: 24px; margin-top: 8px; font-size: 16px; }
.rules { margin: 6px 0 0; padding: 0; list-style: none; line-height: 1.6; color: #cfd6ea; font-size: 16.5px; }
.rules li { position: relative; padding: 6px 0 6px 26px; border-bottom: 1px dashed var(--line); }
.rules li:last-child { border-bottom: 0; }
.rules li::before { content: &quot;▸&quot;; position: absolute; left: 4px; color: var(--accent); }
.gift-note {
  margin-top: 14px; padding: 13px 16px; border-radius: 14px; font-weight: 800; color: #ffe08a;
  background: linear-gradient(90deg, rgba(255,204,51,.16), rgba(255,154,61,.08)); border: 1px solid rgba(255,204,51,.35);
}
.admin { margin-top: 26px; display: flex; gap: 10px; justify-content: center; align-items: center; color: var(--muted); font-size: 14px; flex-wrap: wrap; }

[hidden] { display: none !important; }
.btn.ghost.danger { color: var(--up); border-color: var(--up); background: var(--danger-bg); }
.btn:focus-visible, .choice:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.export { margin-top: 18px; }
.export-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.export-head h2 { margin: 0; }
.export-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.export-msg { color: var(--muted); font-size: 15px; margin: 12px 0 8px; }
.export textarea {
  width: 100%; height: 160px; resize: vertical; font: 13px/1.5 ui-monospace, Consolas, monospace;
  background: rgba(7,11,24,.8); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 10px;
  white-space: pre; overflow: auto;
}

/* ===== 모드 ===== */
.mode-row { display: grid; grid-template-columns: 1.4fr 1fr; gap: 10px; margin-top: 12px; }
.mode-row .btn { font-size: 19px; padding: 15px 12px; }
#hardBtn { background: linear-gradient(180deg, #ff8a5c, #ff4d5e 55%, #d6283d); color: #fff; box-shadow: 0 8px 22px rgba(255,77,94,.35), inset 0 1px 0 rgba(255,255,255,.4); }
#hardBtn:hover { box-shadow: 0 12px 28px rgba(255,77,94,.5), inset 0 1px 0 rgba(255,255,255,.4); }
.btn.practice-btn { background: var(--practice-bg); color: var(--practice); border: 2px solid var(--practice); box-shadow: 0 0 18px rgba(62,207,142,.12); }
.btn.practice-btn:hover { box-shadow: 0 0 24px rgba(62,207,142,.3); }
.mode-pill { background: var(--danger-bg); color: var(--up); border-color: rgba(255,77,94,.4); }
body.practice .mode-pill { background: var(--practice-bg); color: var(--practice); border-color: rgba(62,207,142,.4); }
body.practice .news .tag { background: var(--practice); color: #06281b; }
#resMode { display: inline-block; color: var(--up); margin: 10px 0 0; font-size: 16px; font-weight: 800; padding: 5px 14px; border-radius: 999px; background: rgba(255,77,94,.12); border: 1px solid rgba(255,77,94,.35); }
body.practice #resMode { color: var(--practice); background: rgba(62,207,142,.12); border-color: rgba(62,207,142,.35); }

/* ===== 순위표 ===== */
table.rank { width: 100%; border-collapse: separate; border-spacing: 0 6px; font-size: 19px; }
table.rank td { padding: 11px 10px; background: rgba(255,255,255,.035); }
table.rank td:first-child { border-radius: 12px 0 0 12px; }
table.rank td:last-child { border-radius: 0 12px 12px 0; }
table.rank tr:nth-child(1) td { background: linear-gradient(90deg, rgba(255,204,51,.18), rgba(255,255,255,.03)); }
table.rank tr:nth-child(2) td { background: linear-gradient(90deg, rgba(200,210,235,.14), rgba(255,255,255,.03)); }
table.rank tr:nth-child(3) td { background: linear-gradient(90deg, rgba(220,140,80,.15), rgba(255,255,255,.03)); }
table.rank td.no { width: 52px; font-weight: 900; color: var(--muted); text-align: center; font-size: 21px; }
table.rank td.rate { text-align: right; font-weight: 900; }
table.rank td.money { text-align: right; color: var(--muted); font-size: 16px; }
table.rank tr.me td { background: rgba(255,204,51,.22) !important; border-top: 1px solid rgba(255,204,51,.5); border-bottom: 1px solid rgba(255,204,51,.5); }
table.rank tr.me td:first-child { border-left: 1px solid rgba(255,204,51,.5); }
table.rank tr.me td:last-child { border-right: 1px solid rgba(255,204,51,.5); }
table.rank tr.me td.no { color: var(--accent); }
table.rank tr.gap td { text-align: center; color: var(--muted); background: none !important; padding: 0; }
.empty { color: var(--muted); padding: 10px 0; }
.empty b { color: var(--accent); }

/* ===== 라운드 화면 ===== */
.timer { margin: 16px 0 18px; }
.timer-head { display: flex; justify-content: space-between; align-items: end; color: var(--muted); font-size: 16px; margin-bottom: 8px; }
.timer-head b { font-size: 30px; color: var(--text); font-variant-numeric: tabular-nums; }
.timer-head b.hurry { color: var(--up); animation: pulse .5s ease-in-out infinite alternate; }
@keyframes pulse { to { transform: scale(1.15); text-shadow: 0 0 14px var(--up); } }
.bar { height: 14px; background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.bar i {
  display: block; height: 100%; width: 100%; border-radius: 999px;
  background: linear-gradient(90deg, #ffe27a, var(--accent), var(--accent2)); box-shadow: 0 0 14px rgba(255,204,51,.6);
}
.bar i.hurry { background: linear-gradient(90deg, #ff8a5c, var(--up)); box-shadow: 0 0 14px rgba(255,77,94,.7); }

.news {
  position: relative; overflow: hidden; background: linear-gradient(180deg, #ffffff, #f2f5fc); color: #111;
  border-radius: 22px; padding: 22px 28px 24px; box-shadow: 0 20px 44px rgba(0,0,0,.45);
  animation: rise .4s ease both;
}
.news::before { content: &quot;&quot;; position: absolute; left: 0; top: 0; bottom: 0; width: 7px; background: linear-gradient(180deg, var(--up), #ff9a3d); }
body.practice .news::before { background: linear-gradient(180deg, var(--practice), #9ff0c8); }
.news .tag {
  display: inline-flex; align-items: center; gap: 6px; background: var(--up); color: #fff; font-weight: 900;
  padding: 4px 12px; border-radius: 6px; font-size: 16px; letter-spacing: 1px;
}
.news .tag::before { content: &quot;&quot;; width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .3; } }
.news .cat { display: inline-block; margin-left: 6px; padding: 4px 12px; border-radius: 6px; background: #e8edf8; color: #3b4566; font-weight: 800; font-size: 16px; }
.news h2 { font-size: 36px; margin: 14px 0 8px; letter-spacing: -1px; line-height: 1.3; }
.news p { margin: 0; color: #4a5168; font-size: 19px; line-height: 1.55; }

.choices { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 22px; }
.choice {
  position: relative; overflow: hidden; color: var(--text); padding: 18px 10px 16px; text-align: center;
  background: linear-gradient(180deg, rgba(34,46,84,.9), rgba(20,28,54,.9)); border: 1.5px solid var(--line-strong); border-radius: 18px;
  box-shadow: 0 10px 24px rgba(0,0,0,.3); transition: transform .15s, border-color .15s, box-shadow .2s;
  animation: rise .35s ease both;
}
.choice:nth-child(2) { animation-delay: .04s; } .choice:nth-child(3) { animation-delay: .08s; } .choice:nth-child(4) { animation-delay: .12s; }
.choice:nth-child(5) { animation-delay: .16s; } .choice:nth-child(6) { animation-delay: .2s; } .choice:nth-child(7) { animation-delay: .24s; } .choice:nth-child(8) { animation-delay: .28s; }
.choice::after { content: &quot;&quot;; position: absolute; inset: 0; background: radial-gradient(120% 80% at 50% 0%, rgba(255,204,51,.18), transparent 60%); opacity: 0; transition: opacity .2s; }
.choice:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-4px); box-shadow: 0 0 22px rgba(255,204,51,.3), 0 14px 28px rgba(0,0,0,.35); }
.choice:hover:not(:disabled)::after { opacity: 1; }
.choice:disabled { opacity: .45; cursor: default; }
.choice .emo { position: relative; display: grid; place-items: center; width: 62px; height: 62px; margin: 0 auto; font-size: 34px; border-radius: 50%;
               background: radial-gradient(circle, rgba(255,255,255,.12), rgba(255,255,255,.02) 70%); box-shadow: inset 0 0 0 1px var(--line-strong); }
.choice .nm { position: relative; font-size: 21px; font-weight: 900; display: block; margin-top: 8px; }
.choice .sec { position: relative; font-size: 14px; color: var(--muted); }
.choice .key { position: absolute; top: 9px; left: 10px; font-size: 13px; font-weight: 800; color: var(--muted); background: rgba(255,255,255,.06); border: 1px solid var(--line-strong); border-radius: 6px; padding: 0 7px; z-index: 1; }
.choice.cash { background: linear-gradient(180deg, rgba(30,62,52,.9), rgba(18,40,34,.9)); border-color: rgba(62,207,142,.4); }
.choice.cash:hover:not(:disabled) { border-color: var(--practice); box-shadow: 0 0 22px rgba(62,207,142,.3), 0 14px 28px rgba(0,0,0,.35); }

/* ===== 등락률 공개 화면 ===== */
.result-hero { text-align: center; padding: 22px 0 10px; }
.result-hero .sub { color: #b8c3e3; font-size: 20px; font-weight: 700; }
.result-hero .big { font-size: 88px; font-weight: 900; margin: 4px 0; letter-spacing: -3px; font-variant-numeric: tabular-nums; animation: pop .45s cubic-bezier(.2,.9,.3,1.4) both; }
.result-hero .big.up { text-shadow: 0 0 40px rgba(255,77,94,.55); }
.result-hero .big.down { text-shadow: 0 0 40px rgba(61,139,255,.55); }
.result-hero .big.up::before { content: &quot;▲ &quot;; font-size: .5em; vertical-align: .35em; }
.result-hero .big.down::before { content: &quot;▼ &quot;; font-size: .5em; vertical-align: .35em; }
.result-hero .money { display: inline-block; font-size: 22px; padding: 10px 20px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
.result-hero .money b { color: var(--accent); }
.moves { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; margin: 24px 0; }
.move {
  position: relative; overflow: hidden; background: var(--panel); border: 1.5px solid var(--line); border-radius: 16px; padding: 12px 6px 10px; text-align: center;
  animation: pop .35s ease both;
}
.move.picked { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,204,51,.25), 0 0 24px rgba(255,204,51,.3); }
.move.picked::before { content: &quot;내 선택&quot;; position: absolute; top: 0; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 900; color: #2a1c00; background: var(--accent); padding: 1px 8px; border-radius: 0 0 8px 8px; }
.move .emo { font-size: 28px; margin-top: 6px; }
.move .nm { font-size: 15px; font-weight: 800; margin-top: 2px; }
.move .chg { font-size: 22px; font-weight: 900; margin-top: 4px; font-variant-numeric: tabular-nums; }
/* 등락 막대: 가운데 선 기준으로 위(상승) 또는 아래(하락)로 자람 */
.mbar { position: relative; height: 70px; margin: 8px auto 0; width: 26px; }
.mbar::before { content: &quot;&quot;; position: absolute; left: -10px; right: -10px; top: 50%; height: 1px; background: var(--line-strong); }
.mbar i { position: absolute; left: 0; right: 0; border-radius: 5px; transform-origin: bottom; animation: grow .7s cubic-bezier(.2,.8,.3,1) both; animation-delay: inherit; }
.mbar i.up { bottom: 50%; background: linear-gradient(0deg, rgba(255,77,94,.5), var(--up)); box-shadow: 0 0 10px rgba(255,77,94,.5); }
.mbar i.down { top: 50%; background: linear-gradient(180deg, rgba(61,139,255,.5), var(--down)); box-shadow: 0 0 10px rgba(61,139,255,.5); transform-origin: top; }
@keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
.why { position: relative; background: linear-gradient(90deg, rgba(255,204,51,.1), var(--panel)); border: 1px solid rgba(255,204,51,.25); border-radius: 18px; padding: 18px 22px; line-height: 1.65; color: #dde3f3; animation: rise .5s ease both .3s; }
.why b { color: var(--accent); }

/* ===== 최종 결과 화면 ===== */
#result .hero h1 { font-size: 52px !important; }
.final-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin-top: 18px; }
.final-grid .card { animation: rise .5s ease both; }
.final-grid .card + .card { animation-delay: .12s; }
.title-desc { color: var(--muted); }
.title-badge {
  display: inline-block; font-size: 38px; font-weight: 900; margin: 10px 0 6px; padding: 8px 20px; border-radius: 16px;
  background: linear-gradient(90deg, rgba(255,204,51,.16), rgba(255,154,61,.08)); border: 1px solid rgba(255,204,51,.4);
  box-shadow: 0 0 30px rgba(255,204,51,.15); animation: pop .6s cubic-bezier(.2,.9,.3,1.4) both .2s;
}
.stat { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 20px; }
.stat b { font-size: 30px; font-variant-numeric: tabular-nums; }
.history { margin-top: 14px; display: grid; gap: 6px; }
.hrow { display: grid; grid-template-columns: 42px 1fr auto; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px; background: rgba(255,255,255,.04); font-size: 16px; color: #d4dbef; animation: rise .4s ease both; }
.hrow .r { font-weight: 900; color: var(--muted); font-size: 14px; }
.hrow .c { font-weight: 900; font-variant-numeric: tabular-nums; }
.hrow .to { font-size: 12px; color: var(--muted); margin-left: 4px; }
.gift {
  margin-top: 16px; padding: 18px; border-radius: 16px; background: linear-gradient(90deg, #ffe27a, #ffcc33, #ff8a3d); background-size: 200% 100%;
  color: #2a1400; font-weight: 900; font-size: 22px; text-align: center; box-shadow: 0 0 34px rgba(255,190,50,.5);
  animation: pop .5s ease, shimmer 3s linear infinite;
}
.nogift { margin-top: 16px; padding: 13px; border-radius: 14px; background: rgba(255,255,255,.04); border: 1px dashed var(--line-strong); color: var(--muted); text-align: center; }
.nogift b { color: var(--practice); }

/* ===== 자산 변화 그래프 (최종 결과) ===== */
.asset-chart { margin-top: 14px; padding: 12px 10px 6px; border-radius: 16px; background: rgba(7,11,24,.55); border: 1px solid var(--line); }
.asset-chart .cap { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); padding: 0 6px 4px; }
.asset-chart .cap b { color: var(--text); }
.asset-chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.asset-chart .grid { stroke: rgba(120,150,220,.14); stroke-width: 1; }
.asset-chart .base { stroke: rgba(255,255,255,.35); stroke-width: 1.5; stroke-dasharray: 5 5; }
.asset-chart .base-t { fill: var(--muted); font-size: 12px; }
.asset-chart .line { fill: none; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 2000; stroke-dashoffset: 2000; animation: draw 1.6s ease forwards .3s; }
.asset-chart .area { opacity: 0; animation: fadein 1s ease forwards 1.2s; }
.asset-chart .pt { opacity: 0; animation: fadein .3s ease forwards; }
.asset-chart .pt circle { stroke: #0b1124; stroke-width: 3; }
.asset-chart .lbl { fill: var(--muted); font-size: 13px; font-weight: 700; text-anchor: middle; }
.asset-chart .val { font-size: 13px; font-weight: 900; text-anchor: middle; }
.asset-chart .val.up { fill: var(--up); } .asset-chart .val.down { fill: var(--down); } .asset-chart .val.flat { fill: var(--flat); }

/* ===== 효과음 버튼 ===== */
.sound-btn {
  position: fixed; right: 16px; bottom: 16px; z-index: 30; border: 1px solid var(--line-strong); border-radius: 999px;
  padding: 9px 15px; font-size: 15px; font-weight: 700; color: var(--text); background: rgba(20,28,54,.85); backdrop-filter: blur(6px);
  box-shadow: 0 6px 18px rgba(0,0,0,.35);
}
.sound-btn:hover { border-color: var(--accent); }
.sound-btn.off { color: var(--muted); }

/* ===== 대기 화면 ===== */
.attract {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; overflow: hidden; cursor: pointer;
  background:
    radial-gradient(900px 600px at 50% 0%, rgba(255,204,51,.16), transparent 60%),
    radial-gradient(800px 600px at 0% 100%, rgba(61,139,255,.22), transparent 60%),
    radial-gradient(800px 600px at 100% 100%, rgba(255,77,94,.18), transparent 60%),
    #05080f;
  animation: fade .5s ease;
}
.attract-bg span { position: absolute; bottom: -60px; font-size: var(--fs); opacity: .5; animation: floatup var(--dur) linear infinite; animation-delay: var(--dl); }
@keyframes floatup { from { transform: translateY(0) rotate(0); opacity: 0; } 10% { opacity: .55; } 90% { opacity: .55; } to { transform: translateY(-115vh) rotate(var(--rot)); opacity: 0; } }
.attract-inner { position: relative; width: min(1000px, 92vw); text-align: center; }
.attract h1 { font-size: clamp(48px, 8vw, 96px); margin: 16px 0 0; letter-spacing: -3px; line-height: 1.05; }
.attract h1 span {
  background: linear-gradient(90deg, #ffe27a, var(--accent), var(--accent2), #ffe27a); background-size: 200% 100%;
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: var(--accent); animation: shimmer 5s linear infinite;
}
.attract .eyebrow {
  display: inline-flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 800; letter-spacing: 3px; color: var(--accent);
  padding: 7px 16px; border-radius: 999px; background: rgba(255,204,51,.08); border: 1px solid rgba(255,204,51,.3);
}
.attract .eyebrow .live { width: 9px; height: 9px; border-radius: 50%; background: var(--up); box-shadow: 0 0 10px var(--up); animation: blink 1s steps(2) infinite; }
.attract-cta { font-size: clamp(22px, 3vw, 32px); font-weight: 800; color: #dfe6fa; margin: 14px 0 0; }
.attract-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; margin-top: 30px; text-align: left; }
.attract-grid .card { padding: 20px 22px; }
.steps .step { display: flex; align-items: center; gap: 12px; padding: 10px 0; font-size: 19px; border-bottom: 1px dashed var(--line); }
.steps .step b { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #2a1c00; background: linear-gradient(180deg, #ffe27a, var(--accent)); }
.steps .step em { font-style: normal; color: var(--accent); font-weight: 900; }
.attract-gift { margin-top: 14px; padding: 12px 14px; border-radius: 14px; font-weight: 900; color: #2a1400; text-align: center;
                background: linear-gradient(90deg, #ffe27a, #ffcc33, #ff8a3d); background-size: 200% 100%; animation: shimmer 3s linear infinite; }
.attract-tap { margin-top: 30px; font-size: 22px; font-weight: 800; color: var(--accent); animation: breathe 1.6s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { opacity: .45; transform: scale(.98); } 50% { opacity: 1; transform: scale(1.02); } }

/* ===== 좁은 화면 ===== */
@media (max-width: 860px) {
  .start-grid, .final-grid, .mode-row { grid-template-columns: 1fr; }
  .choices { grid-template-columns: repeat(2, 1fr); }
  .moves { grid-template-columns: repeat(4, 1fr); }
  .hero h1 { font-size: 46px; }
  .result-hero .big { font-size: 64px; }
  .news h2 { font-size: 28px; }
  .attract-grid { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .hero .chart-bg .line { stroke-dashoffset: 0; }
  .hero .chart-bg .area, .hero .chart-bg .dot { opacity: 1; }
}

&lt;script&gt;
// =====================================================================
// 1. 데이터 꺼내기 (maingame.py 가 넣어 준 GAME 객체)
// =====================================================================
const CFG = GAME.config;
const STOCKS = GAME.stocks;
const PRACTICE_NEWS = GAME.practiceNews;
const HARD_NEWS = GAME.hardNews;
const TITLES = GAME.titles;
const CASH_TITLE = GAME.cashTitle;

// =====================================================================
// 2. 도우미 함수
// =====================================================================
const $ = (id) =&gt; document.getElementById(id);
const won = (n) =&gt; Math.round(n).toLocaleString(&quot;ko-KR&quot;) + &quot;원&quot;;
const signedWon = (n) =&gt; (n &gt; 0 ? &quot;+&quot; : n &lt; 0 ? &quot;-&quot; : &quot;&quot;) + Math.abs(Math.round(n)).toLocaleString(&quot;ko-KR&quot;) + &quot;원&quot;;
const pct = (n) =&gt; (n &gt; 0 ? &quot;+&quot; : &quot;&quot;) + n.toFixed(1) + &quot;%&quot;;
const tone = (n) =&gt; (n &gt; 0 ? &quot;up&quot; : n &lt; 0 ? &quot;down&quot; : &quot;flat&quot;);
const round1 = (n) =&gt; Math.round(n * 10) / 10;
const esc = (s) =&gt; String(s).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, (c) =&gt; ({ &quot;&amp;&quot;: &quot;&amp;amp;&quot;, &quot;&lt;&quot;: &quot;&amp;lt;&quot;, &quot;&gt;&quot;: &quot;&amp;gt;&quot;, &#x27;&quot;&#x27;: &quot;&amp;quot;&quot;, &quot;&#x27;&quot;: &quot;&amp;#39;&quot; }[c]));
const stockById = (id) =&gt; STOCKS.find((s) =&gt; s.id === id);
const MODE_LABEL = { practice: &quot;연습 모드&quot;, hard: &quot;하드 모드&quot; };

function shuffle(arr) {
  for (let i = arr.length - 1; i &gt; 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

const randomOf = (arr) =&gt; arr[Math.floor(Math.random() * arr.length)];

// 연습 모드 뉴스 뽑기: 뉴스 중 count 개를 똑같은 확률로 뽑음
function pickPracticeNews(pool, count) {
  return shuffle(pool.slice()).slice(0, count);
}

// 하드 모드 뉴스 뽑기:
//   1) 분야 중 count 개를 똑같은 확률로 뽑고 (순서도 무작위)
//   2) 뽑힌 분야마다 그 분야 뉴스 중 하나를 똑같은 확률로 뽑음
//   → 분야가 겹치지 않고, 뉴스 하나가 나올 확률 = (count / 분야 수) × (1 / 그 분야 뉴스 수)
function pickHardNews(pool, count) {
  const categories = shuffle([...new Set(pool.map((n) =&gt; n.category))]);
  const picked = categories.slice(0, count).map((c) =&gt; randomOf(pool.filter((n) =&gt; n.category === c)));
  // 분야 수가 라운드 수보다 적을 때만: 남은 뉴스로 채움
  const rest = shuffle(pool.filter((n) =&gt; !picked.includes(n)));
  while (picked.length &lt; count &amp;&amp; rest.length) picked.push(rest.pop());
  return picked;
}

// 숫자가 0에서 목표값까지 올라가는 효과 (예: +12.5%)
function countUp(el, target, ms) {
  const t0 = performance.now();
  const step = (now) =&gt; {
    const k = Math.min(1, (now - t0) / ms);
    el.textContent = pct(round1(target * (1 - Math.pow(1 - k, 3))));
    if (k &lt; 1) requestAnimationFrame(step);
    else el.textContent = pct(target);
  };
  requestAnimationFrame(step);
}

// =====================================================================
// 효과음 - 소리 파일 없이 브라우저(Web Audio)로 직접 만듦
// =====================================================================
const Sound = {
  ctx: null,
  on: (() =&gt; { try { const v = localStorage.getItem(&quot;investChallengeSound&quot;); if (v !== null) return v === &quot;1&quot;; } catch (e) {} return CFG.soundOn !== false; })(),
  init() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      this.ctx = new AC();
    }
    if (this.ctx.state === &quot;suspended&quot;) this.ctx.resume();
    return this.ctx;
  },
  // 음 하나: 주파수(Hz), 시작 지연(초), 길이(초), 음색, 크기
  tone(freq, at = 0, dur = 0.15, type = &quot;sine&quot;, vol = 0.18) {
    const ctx = this.ctx;
    const t = ctx.currentTime + at;
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g).connect(ctx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  },
  play(name, arg) {
    if (!this.on || !this.init()) return;
    const N = { C4: 262, E4: 330, G4: 392, A4: 440, C5: 523, D5: 587, E5: 659, G5: 784, C6: 1047, E6: 1319 };
    switch (name) {
      case &quot;click&quot;: this.tone(700, 0, 0.06, &quot;triangle&quot;, 0.12); break;
      case &quot;start&quot;: [N.C5, N.E5, N.G5].forEach((f, i) =&gt; this.tone(f, i * 0.07, 0.14, &quot;triangle&quot;, 0.16)); break;
      case &quot;tick&quot;: this.tone(arg ? 1250 : 900, 0, 0.05, &quot;square&quot;, arg ? 0.07 : 0.035); break;   // arg = 5초 이하
      case &quot;pick&quot;: this.tone(880, 0, 0.08, &quot;triangle&quot;, 0.15); this.tone(1320, 0.06, 0.1, &quot;triangle&quot;, 0.12); break;
      case &quot;timeout&quot;: this.tone(180, 0, 0.35, &quot;sawtooth&quot;, 0.12); this.tone(140, 0.12, 0.35, &quot;sawtooth&quot;, 0.1); break;
      case &quot;up&quot;:   // arg = 등락률. 크게 오르면 높은 음 하나 더
        [N.C5, N.E5, N.G5].forEach((f, i) =&gt; this.tone(f, i * 0.09, 0.22, &quot;triangle&quot;, 0.17));
        if (arg &gt;= 10) this.tone(N.C6, 0.3, 0.4, &quot;triangle&quot;, 0.15);
        break;
      case &quot;down&quot;: [N.G4, N.E4, N.C4].forEach((f, i) =&gt; this.tone(f, i * 0.11, 0.25, &quot;sine&quot;, 0.18)); break;
      case &quot;flat&quot;: this.tone(N.A4, 0, 0.15, &quot;sine&quot;, 0.14); this.tone(N.A4, 0.18, 0.15, &quot;sine&quot;, 0.14); break;
      case &quot;gift&quot;:
        [N.C5, N.E5, N.G5, N.C6, N.G5, N.C6, N.E6].forEach((f, i) =&gt; this.tone(f, i * 0.11, i === 6 ? 0.6 : 0.16, &quot;triangle&quot;, 0.17));
        break;
      case &quot;end&quot;: [N.E5, N.G5, N.C6].forEach((f) =&gt; this.tone(f, 0, 0.6, &quot;sine&quot;, 0.08)); break;
    }
  },
  toggle() {
    this.on = !this.on;
    try { localStorage.setItem(&quot;investChallengeSound&quot;, this.on ? &quot;1&quot; : &quot;0&quot;); } catch (e) {}
    renderSoundBtn();
    if (this.on) this.play(&quot;click&quot;);
  },
};

function renderSoundBtn() {
  $(&quot;soundBtn&quot;).textContent = Sound.on ? &quot;🔊 소리 켬&quot; : &quot;🔇 소리 끔&quot;;
  $(&quot;soundBtn&quot;).classList.toggle(&quot;off&quot;, !Sound.on);
}

// =====================================================================
// 자산 변화 그래프 (최종 결과) - 시작 자금과 라운드별 자산을 꺾은선으로
// =====================================================================
function renderAssetChart() {
  const values = [CFG.startMoney, ...state.log.map((l) =&gt; l.after)];
  const W = 520, H = 190, L = 14, R = 14, T = 26, B = 30;
  const lo = Math.min(...values), hi = Math.max(...values);
  const pad = Math.max((hi - lo) * 0.18, CFG.startMoney * 0.03);
  const min = lo - pad, max = hi + pad;
  const x = (i) =&gt; L + (i * (W - L - R)) / (values.length - 1);
  const y = (v) =&gt; T + (1 - (v - min) / (max - min)) * (H - T - B);
  const pts = values.map((v, i) =&gt; [x(i), y(v)]);
  const path = pts.map((p, i) =&gt; (i ? &quot;L&quot; : &quot;M&quot;) + p[0].toFixed(1) + &quot; &quot; + p[1].toFixed(1)).join(&quot; &quot;);
  const last = values[values.length - 1];
  const color = last &gt; CFG.startMoney ? &quot;#ff4d5e&quot; : last &lt; CFG.startMoney ? &quot;#3d8bff&quot; : &quot;#a8b0c4&quot;;
  const baseY = y(CFG.startMoney);
  const grid = [0.25, 0.5, 0.75].map((k) =&gt; `&lt;line class=&quot;grid&quot; x1=&quot;${L}&quot; x2=&quot;${W - R}&quot; y1=&quot;${T + k * (H - T - B)}&quot; y2=&quot;${T + k * (H - T - B)}&quot;/&gt;`).join(&quot;&quot;);
  const dots = pts.map((p, i) =&gt; {
    const c = i === 0 ? &quot;#a8b0c4&quot; : state.log[i - 1].change &gt; 0 ? &quot;#ff4d5e&quot; : state.log[i - 1].change &lt; 0 ? &quot;#3d8bff&quot; : &quot;#a8b0c4&quot;;
    const lbl = i === 0 ? &quot;시작&quot; : &quot;R&quot; + i;
    const val = i === 0 ? &quot;&quot; : `&lt;text class=&quot;val ${tone(state.log[i - 1].change)}&quot; x=&quot;${p[0]}&quot; y=&quot;${p[1] - 12}&quot;&gt;${pct(state.log[i - 1].change)}&lt;/text&gt;`;
    return `&lt;g class=&quot;pt&quot; style=&quot;animation-delay:${0.3 + i * 0.25}s&quot;&gt;&lt;circle cx=&quot;${p[0]}&quot; cy=&quot;${p[1]}&quot; r=&quot;${i === values.length - 1 ? 8 : 6}&quot; fill=&quot;${c}&quot;/&gt;${val}` +
      `&lt;text class=&quot;lbl&quot; x=&quot;${p[0]}&quot; y=&quot;${H - 8}&quot;&gt;${lbl}&lt;/text&gt;&lt;/g&gt;`;
  }).join(&quot;&quot;);
  $(&quot;resChart&quot;).innerHTML =
    `&lt;div class=&quot;cap&quot;&gt;&lt;span&gt;📈 내 자산 변화&lt;/span&gt;&lt;span&gt;시작 ${won(CFG.startMoney)} → &lt;b&gt;${won(last)}&lt;/b&gt;&lt;/span&gt;&lt;/div&gt;` +
    `&lt;svg viewBox=&quot;0 0 ${W} ${H}&quot; role=&quot;img&quot; aria-label=&quot;라운드별 자산 변화 그래프&quot;&gt;` +
      `&lt;defs&gt;&lt;linearGradient id=&quot;acArea&quot; x1=&quot;0&quot; y1=&quot;0&quot; x2=&quot;0&quot; y2=&quot;1&quot;&gt;&lt;stop offset=&quot;0&quot; stop-color=&quot;${color}&quot; stop-opacity=&quot;.35&quot;/&gt;&lt;stop offset=&quot;1&quot; stop-color=&quot;${color}&quot; stop-opacity=&quot;0&quot;/&gt;&lt;/linearGradient&gt;&lt;/defs&gt;` +
      grid +
      `&lt;line class=&quot;base&quot; x1=&quot;${L}&quot; x2=&quot;${W - R}&quot; y1=&quot;${baseY}&quot; y2=&quot;${baseY}&quot;/&gt;` +
      `&lt;path class=&quot;area&quot; d=&quot;${path} L${pts[pts.length - 1][0]} ${H - B} L${pts[0][0]} ${H - B} Z&quot; fill=&quot;url(#acArea)&quot;/&gt;` +
      `&lt;path class=&quot;line&quot; d=&quot;${path}&quot; stroke=&quot;${color}&quot; style=&quot;filter:drop-shadow(0 0 6px ${color})&quot;/&gt;` +
      dots +
    `&lt;/svg&gt;`;
}

// =====================================================================
// 대기 화면 - 시작 화면에서 IDLE_SECONDS 동안 입력이 없으면 나타남
// =====================================================================
let lastActivity = Date.now();

function showAttract() {
  renderRank(&quot;attractRank&quot;, null);
  $(&quot;attract&quot;).hidden = false;
}

function hideAttract() {
  $(&quot;attract&quot;).hidden = true;
  lastActivity = Date.now();
  refreshStart();
  $(&quot;nick&quot;).focus();
}

function setupAttract() {
  $(&quot;attractRounds&quot;).textContent = CFG.rounds;
  $(&quot;attractGift&quot;).textContent = `⭐ 하드 모드 수익률 ${CFG.giftRate}% 이상이면 도장 1개 더!`;
  // 배경에 떠오르는 장식 (돈, 그래프, 화살표)
  const icons = [&quot;💰&quot;, &quot;📈&quot;, &quot;💵&quot;, &quot;🪙&quot;, &quot;📊&quot;, &quot;🚀&quot;, &quot;💎&quot;, &quot;📰&quot;];
  $(&quot;attractBg&quot;).innerHTML = Array.from({ length: 22 }, (_, i) =&gt;
    `&lt;span style=&quot;left:${(i * 4.6 + Math.random() * 3).toFixed(1)}%;--fs:${22 + Math.random() * 26}px;--dur:${9 + Math.random() * 8}s;--dl:${-Math.random() * 16}s;--rot:${-40 + Math.random() * 80}deg&quot;&gt;${icons[i % icons.length]}&lt;/span&gt;`
  ).join(&quot;&quot;);

  // 사용자가 무언가 하면 시간 초기화. 대기 화면이 떠 있으면 키·터치로 닫기 (그 입력은 게임에 전달하지 않음)
  const onInput = (e) =&gt; {
    lastActivity = Date.now();
    if (!$(&quot;attract&quot;).hidden &amp;&amp; (e.type === &quot;keydown&quot; || e.type === &quot;pointerdown&quot;)) {
      e.preventDefault();
      e.stopPropagation();
      hideAttract();
    }
  };
  [&quot;keydown&quot;, &quot;pointerdown&quot;].forEach((t) =&gt; document.addEventListener(t, onInput, true));
  document.addEventListener(&quot;mousemove&quot;, () =&gt; { if ($(&quot;attract&quot;).hidden) lastActivity = Date.now(); }, true);

  if (!(CFG.idleSeconds &gt; 0)) return;
  setInterval(() =&gt; {
    const onStart = document.querySelector(&quot;.screen.active&quot;).id === &quot;start&quot;;
    const busy = !$(&quot;exportPanel&quot;).hidden || $(&quot;nick&quot;).value.trim() !== &quot;&quot;;
    if (onStart &amp;&amp; !busy &amp;&amp; $(&quot;attract&quot;).hidden &amp;&amp; Date.now() - lastActivity &gt; CFG.idleSeconds * 1000) showAttract();
  }, 1000);
}

function show(id) {
  document.querySelectorAll(&quot;.screen&quot;).forEach((s) =&gt; s.classList.toggle(&quot;active&quot;, s.id === id));
}

// =====================================================================
// 3. 기록 저장 (브라우저 localStorage, 오늘 날짜별) - 하드 모드만 기록
// =====================================================================
let memRecords = [];   // localStorage 를 못 쓰는 환경을 위한 예비 저장소

function todayStr() {
  const d = new Date();
  return d.getFullYear() + &quot;-&quot; + String(d.getMonth() + 1).padStart(2, &quot;0&quot;) + &quot;-&quot; + String(d.getDate()).padStart(2, &quot;0&quot;);
}
const storeKey = () =&gt; &quot;investChallenge2:&quot; + todayStr();

function loadRecords() {
  try {
    const v = localStorage.getItem(storeKey());
    if (v) return JSON.parse(v);
  } catch (e) {}
  return memRecords.slice();
}

function saveRecords(recs) {
  memRecords = recs.slice();
  try { localStorage.setItem(storeKey(), JSON.stringify(recs)); } catch (e) {}
}

function sortedRecords() {
  return loadRecords().sort((a, b) =&gt; b.final - a.final || a.time.localeCompare(b.time));
}

// =====================================================================
// 4. 순위표 그리기 (하드 모드)
// =====================================================================
function renderRank(target, myId) {
  const recs = sortedRecords();
  if (!recs.length) {
    $(target).innerHTML = &#x27;&lt;div class=&quot;empty&quot;&gt;아직 기록이 없어요. 첫 번째 주인공이 되어 보세요!&lt;/div&gt;&#x27;;
    return;
  }
  const medal = [&quot;🥇&quot;, &quot;🥈&quot;, &quot;🥉&quot;, &quot;4&quot;, &quot;5&quot;];
  const row = (r, i) =&gt;
    `&lt;tr class=&quot;${r.id === myId ? &quot;me&quot; : &quot;&quot;}&quot;&gt;&lt;td class=&quot;no&quot;&gt;${i &lt; 5 ? medal[i] : i + 1}&lt;/td&gt;` +
    `&lt;td&gt;${esc(r.name)}${r.id === myId ? &quot; (나)&quot; : &quot;&quot;}&lt;/td&gt;` +
    `&lt;td class=&quot;money&quot;&gt;${won(r.final)}&lt;/td&gt;&lt;td class=&quot;rate ${tone(r.rate)}&quot;&gt;${pct(r.rate)}&lt;/td&gt;&lt;/tr&gt;`;
  let html = &#x27;&lt;table class=&quot;rank&quot;&gt;&#x27; + recs.slice(0, 5).map(row).join(&quot;&quot;);
  const myIdx = recs.findIndex((r) =&gt; r.id === myId);
  if (myIdx &gt;= 5) html += &#x27;&lt;tr class=&quot;gap&quot;&gt;&lt;td colspan=&quot;4&quot;&gt;⋮&lt;/td&gt;&lt;/tr&gt;&#x27; + row(recs[myIdx], myIdx);
  html += &quot;&lt;/table&gt;&quot;;
  if (myIdx &gt;= 0) html += `&lt;div class=&quot;empty&quot;&gt;오늘 하드 모드 참가자 ${recs.length}명 중 &lt;b&gt;${myIdx + 1}위&lt;/b&gt;&lt;/div&gt;`;
  $(target).innerHTML = html;
}

function refreshStart() {
  renderRank(&quot;startRank&quot;, null);
  $(&quot;todayCount&quot;).textContent = `오늘(${todayStr()}) 하드 모드 참가자 ${loadRecords().length}명`;
}

// =====================================================================
// 5. 게임 진행: 시작 → 라운드 → 선택 → 공개
// =====================================================================
let state = null;

function startGame(mode) {
  const name = $(&quot;nick&quot;).value.trim();
  if (!name) {
    $(&quot;nickMsg&quot;).textContent = &quot;닉네임을 입력해 주세요!&quot;;
    $(&quot;nick&quot;).focus();
    return;
  }
  $(&quot;nickMsg&quot;).textContent = &quot;&quot;;
  state = {
    name,
    mode,
    money: CFG.startMoney,
    round: 0,
    news: mode === &quot;practice&quot; ? pickPracticeNews(PRACTICE_NEWS, CFG.rounds) : pickHardNews(HARD_NEWS, CFG.rounds),
    log: [],
    picked: false,
    timer: null,
  };
  state.rounds = state.news.length;
  document.body.classList.toggle(&quot;practice&quot;, mode === &quot;practice&quot;);
  Sound.play(&quot;start&quot;);
  startRound();
}

function startRound() {
  const n = state.news[state.round];
  state.picked = false;
  $(&quot;roundLabel&quot;).textContent = `ROUND ${state.round + 1} / ${state.rounds}`;
  $(&quot;modeLabel&quot;).textContent = MODE_LABEL[state.mode];
  $(&quot;playerName&quot;).textContent = state.name;
  $(&quot;moneyNow&quot;).textContent = won(state.money);
  $(&quot;newsCat&quot;).textContent = n.category;
  $(&quot;newsTitle&quot;).textContent = n.title;
  $(&quot;newsBody&quot;).textContent = n.body;
  document.querySelectorAll(&quot;.choice&quot;).forEach((b) =&gt; (b.disabled = false));
  show(&quot;round&quot;);

  // 제한 시간 타이머 (0.1초마다 갱신, 시간이 다 되면 현금 보유)
  state.roundStart = performance.now();
  const limit = CFG.timeLimit * 1000;
  let lastSec = null;
  const tick = () =&gt; {
    const left = Math.max(0, limit - (performance.now() - state.roundStart));
    const hurry = left &lt;= 5000;
    const sec = Math.ceil(left / 1000);
    if (lastSec !== null &amp;&amp; sec !== lastSec &amp;&amp; sec &gt; 0) Sound.play(&quot;tick&quot;, hurry);   // 1초마다 째깍
    lastSec = sec;
    $(&quot;timeText&quot;).textContent = Math.ceil(left / 1000) + &quot;초&quot;;
    $(&quot;timeText&quot;).classList.toggle(&quot;hurry&quot;, hurry);
    $(&quot;timeBar&quot;).style.width = (left / limit) * 100 + &quot;%&quot;;
    $(&quot;timeBar&quot;).classList.toggle(&quot;hurry&quot;, hurry);
    if (left &lt;= 0) pick(&quot;cash&quot;, true);
  };
  tick();
  state.timer = setInterval(tick, 100);
}

function pick(choiceId, timeout) {
  if (!state || state.picked) return;
  state.picked = true;
  clearInterval(state.timer);
  document.querySelectorAll(&quot;.choice&quot;).forEach((b) =&gt; (b.disabled = true));

  // 등락률 = 뉴스에 정해 둔 값 그대로 (무작위 없음 → 같은 선택이면 항상 같은 결과)
  const n = state.news[state.round];
  const changes = {};
  STOCKS.forEach((s) =&gt; {
    changes[s.id] = n.fx[s.id] || 0;
  });
  const change = choiceId === &quot;cash&quot; ? 0 : changes[choiceId];
  Sound.play(timeout ? &quot;timeout&quot; : &quot;pick&quot;);
  setTimeout(() =&gt; Sound.play(change &gt; 0 ? &quot;up&quot; : change &lt; 0 ? &quot;down&quot; : &quot;flat&quot;, change), timeout ? 450 : 250);
  const before = state.money;
  state.money = Math.round(before * (1 + change / 100));
  state.log.push({
    news: n.title,
    category: n.category,
    pick: choiceId === &quot;cash&quot; ? &quot;현금 보유&quot; : stockById(choiceId).name,
    timeout: !!timeout,
    secs: round1(Math.min(CFG.timeLimit, (performance.now() - state.roundStart) / 1000)),
    change,
    before,
    after: state.money,
  });
  showReveal(choiceId, changes, change, before, timeout);
}

function showReveal(choiceId, changes, change, before, timeout) {
  const n = state.news[state.round];
  $(&quot;revealRound&quot;).textContent = `ROUND ${state.round + 1} / ${state.rounds} 결과`;
  $(&quot;revealName&quot;).textContent = state.name;
  if (choiceId === &quot;cash&quot;) {
    $(&quot;revealPick&quot;).textContent = timeout ? &quot;⏰ 시간 초과! 현금 보유로 처리되었어요&quot; : &quot;💵 현금 보유를 선택했어요&quot;;
  } else {
    const s = stockById(choiceId);
    $(&quot;revealPick&quot;).textContent = `${s.emo} ${s.name} (${s.sector})에 투자했어요`;
  }
  $(&quot;revealChange&quot;).className = &quot;big &quot; + tone(change);
  countUp($(&quot;revealChange&quot;), change, 700);
  const diff = state.money - before;
  $(&quot;revealMoney&quot;).innerHTML = `보유 자산 ${won(before)} → &lt;b&gt;${won(state.money)}&lt;/b&gt; &lt;span class=&quot;${tone(diff)}&quot;&gt;(${signedWon(diff)})&lt;/span&gt;`;

  // 막대 높이: 가장 크게 움직인 종목을 기준(최소 10%)으로 맞춤
  const maxMove = Math.max(10, ...STOCKS.map((s) =&gt; Math.abs(changes[s.id])));
  $(&quot;moves&quot;).innerHTML = STOCKS.map((s, i) =&gt; {
    const c = changes[s.id];
    const h = Math.max(c ? 4 : 0, (Math.abs(c) / maxMove) * 50);
    return `&lt;div class=&quot;move ${s.id === choiceId ? &quot;picked&quot; : &quot;&quot;}&quot; style=&quot;animation-delay:${i * 0.08}s&quot;&gt;` +
      `&lt;div class=&quot;emo&quot;&gt;${s.emo}&lt;/div&gt;&lt;div class=&quot;nm&quot;&gt;${s.name}&lt;/div&gt;` +
      `&lt;div class=&quot;mbar&quot; style=&quot;animation-delay:${0.15 + i * 0.08}s&quot;&gt;&lt;i class=&quot;${tone(c)}&quot; style=&quot;height:${h}%&quot;&gt;&lt;/i&gt;&lt;/div&gt;` +
      `&lt;div class=&quot;chg ${tone(c)}&quot;&gt;${pct(c)}&lt;/div&gt;&lt;/div&gt;`;
  }).join(&quot;&quot;);
  $(&quot;why&quot;).innerHTML = &quot;💡 &lt;b&gt;왜 그럴까?&lt;/b&gt; &quot; + n.why;
  $(&quot;nextBtn&quot;).textContent = state.round + 1 &lt; state.rounds ? &quot;다음 라운드 ▶&quot; : &quot;최종 결과 보기 ▶&quot;;
  state.revealAt = performance.now();
  show(&quot;reveal&quot;);
}

function nextStep() {
  Sound.play(&quot;click&quot;);
  state.round++;
  if (state.round &lt; state.rounds) startRound();
  else finish();
}

// =====================================================================
// 6. 최종 결과: 칭호, 추가 도장, 기록 저장, 순위
//    연습 모드는 기록·순위·추가 도장 없이 결과만 보여 줌
// =====================================================================
function titleFor(rate, log) {
  if (log.every((l) =&gt; l.pick === &quot;현금 보유&quot;)) return CASH_TITLE;
  return TITLES.find((t) =&gt; t.min === null || rate &gt;= t.min);
}

function finish() {
  const rate = round1(((state.money - CFG.startMoney) / CFG.startMoney) * 100);
  const title = titleFor(rate, state.log);
  const practice = state.mode === &quot;practice&quot;;
  let myId = null;

  if (!practice) {
    const rec = {
      id: Date.now() + &quot;-&quot; + Math.random().toString(36).slice(2, 8),
      name: state.name,
      final: state.money,
      rate,
      title: title.name,
      time: new Date().toISOString(),
      log: state.log,
    };
    const recs = loadRecords();
    recs.push(rec);
    saveRecords(recs);
    myId = rec.id;
  }

  $(&quot;resName&quot;).textContent = state.name;
  $(&quot;resMode&quot;).textContent = MODE_LABEL[state.mode];
  $(&quot;resTitle&quot;).textContent = title.name;
  $(&quot;resTitleDesc&quot;).textContent = title.desc;
  $(&quot;resMoney&quot;).textContent = won(state.money);
  $(&quot;resRate&quot;).textContent = pct(rate);
  $(&quot;resRate&quot;).className = tone(rate);
  $(&quot;resHistory&quot;).innerHTML = state.log.map((l, i) =&gt;
    `&lt;div class=&quot;hrow&quot; style=&quot;animation-delay:${0.2 + i * 0.08}s&quot;&gt;&lt;span class=&quot;r&quot;&gt;R${i + 1}&lt;/span&gt;` +
    `&lt;span&gt;${esc(l.pick)}${l.timeout ? &#x27;&lt;span class=&quot;to&quot;&gt;(시간 초과)&lt;/span&gt;&#x27; : &quot;&quot;}&lt;/span&gt;` +
    `&lt;span class=&quot;c ${tone(l.change)}&quot;&gt;${pct(l.change)}&lt;/span&gt;&lt;/div&gt;`
  ).join(&quot;&quot;);
  if (practice) {
    $(&quot;giftBox&quot;).innerHTML = &#x27;&lt;div class=&quot;nogift&quot;&gt;연습 모드는 추가 도장과 순위가 없어요. 이제 &lt;b&gt;하드 모드&lt;/b&gt;에 도전해 보세요!&lt;/div&gt;&#x27;;
  } else {
    $(&quot;giftBox&quot;).innerHTML = rate &gt;= CFG.giftRate
      ? `&lt;div class=&quot;gift&quot;&gt;⭐ 수익률 ${CFG.giftRate}% 달성! 진행자에게 이 화면을 보여주고 도장 1개 더 받으세요&lt;/div&gt;`
      : `&lt;div class=&quot;nogift&quot;&gt;도장 1개 더 받는 수익률 ${CFG.giftRate}%까지 ${(CFG.giftRate - rate).toFixed(1)}%p 남았어요. 다시 도전!&lt;/div&gt;`;
  }
  renderRank(&quot;resRank&quot;, myId);
  renderAssetChart();
  setTimeout(() =&gt; Sound.play(!practice &amp;&amp; rate &gt;= CFG.giftRate ? &quot;gift&quot; : &quot;end&quot;), 300);
  show(&quot;result&quot;);
}

function nextPlayer() {
  Sound.play(&quot;click&quot;);
  lastActivity = Date.now();
  state = null;
  document.body.classList.remove(&quot;practice&quot;);
  $(&quot;nick&quot;).value = &quot;&quot;;
  refreshStart();
  show(&quot;start&quot;);
  $(&quot;nick&quot;).focus();
}

// =====================================================================
// 7. 운영자 기능: 기록 내보내기, 오늘 기록 초기화 (하드 모드 기록)
// =====================================================================
function recordRows() {
  const head = [&quot;시간&quot;, &quot;닉네임&quot;, &quot;최종자산&quot;, &quot;수익률(%)&quot;, &quot;칭호&quot;];
  for (let i = 1; i &lt;= CFG.rounds; i++) head.push(`R${i} 뉴스`, `R${i} 선택`, `R${i} 등락률(%)`, `R${i} 소요시간(초)`, `R${i} 시간초과`);
  const rows = [head];
  loadRecords().forEach((r) =&gt; {
    const row = [new Date(r.time).toLocaleString(&quot;ko-KR&quot;), r.name, r.final, r.rate, r.title];
    for (let i = 0; i &lt; CFG.rounds; i++) {
      const l = r.log[i] || {};
      row.push(l.news ?? &quot;&quot;, l.pick ?? &quot;&quot;, l.change ?? &quot;&quot;, l.secs ?? &quot;&quot;, l.news ? (l.timeout ? &quot;Y&quot; : &quot;N&quot;) : &quot;&quot;);
    }
    rows.push(row);
  });
  return rows;
}

function toCsv(rows) {
  const q = (v) =&gt; &#x27;&quot;&#x27; + String(v).replace(/&quot;/g, &#x27;&quot;&quot;&#x27;) + &#x27;&quot;&#x27;;
  return rows.map((r) =&gt; r.map(q).join(&quot;,&quot;)).join(&quot;\r\n&quot;);
}

// 엑셀에 붙여넣으면 칸이 바로 나뉘도록 탭으로 구분
function toTsv(rows) {
  return rows.map((r) =&gt; r.map((v) =&gt; String(v).replace(/[\t\r\n]/g, &quot; &quot;)).join(&quot;\t&quot;)).join(&quot;\n&quot;);
}

function openExport() {
  const rows = recordRows();
  $(&quot;exportPanel&quot;).hidden = false;
  $(&quot;exportText&quot;).value = toTsv(rows);
  $(&quot;exportMsg&quot;).textContent = rows.length &gt; 1
    ? `하드 모드 기록 ${rows.length - 1}건. &quot;엑셀용으로 복사&quot;를 누른 뒤 엑셀 첫 칸에 붙여넣으세요. (공유 링크에서는 파일 저장이 막혀 있을 수 있어요)`
    : &quot;오늘 하드 모드 기록이 아직 없어요.&quot;;
  $(&quot;exportPanel&quot;).scrollIntoView({ behavior: &quot;smooth&quot;, block: &quot;nearest&quot; });
}

async function copyExport() {
  const text = $(&quot;exportText&quot;).value;
  try {
    await navigator.clipboard.writeText(text);
    $(&quot;exportMsg&quot;).textContent = &quot;복사했어요. 엑셀 첫 칸(A1)에 붙여넣으세요.&quot;;

    $(&quot;exportText&quot;).focus();

  }
}

function saveCsvFile() {
  const blob = new Blob([&quot;﻿&quot; + toCsv(recordRows())], { type: &quot;text/csv;charset=utf-8&quot; });
  const a = document.createElement(&quot;a&quot;);
  a.href = URL.createObjectURL(blob);
  a.download = `invest_records_${todayStr()}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() =&gt; URL.revokeObjectURL(a.href), 1000);
}

// 초기화는 버튼을 4초 안에 두 번 눌러야 실행 (실수 방지)
let resetArmed = null;
function resetToday() {
  const btn = $(&quot;resetBtn&quot;);
  if (!resetArmed) {
    btn.textContent = `정말 ${loadRecords().length}건을 지울까요? 한 번 더 누르기`;
    btn.classList.add(&quot;danger&quot;);
    resetArmed = setTimeout(disarmReset, 4000);
    return;
  }
  disarmReset();
  memRecords = [];
  try { localStorage.removeItem(storeKey()); } catch (e) {}
  $(&quot;exportPanel&quot;).hidden = true;
  refreshStart();
}

function disarmReset() {
  clearTimeout(resetArmed);
  resetArmed = null;
  $(&quot;resetBtn&quot;).textContent = &quot;오늘 기록 초기화&quot;;
  $(&quot;resetBtn&quot;).classList.remove(&quot;danger&quot;);
}

// =====================================================================
function init() {
  $(&quot;startMoneyLabel&quot;).textContent = won(CFG.startMoney);
  // 맨 위 종목 전광판 (꾸미기용, 두 번 이어 붙여 끊김 없이 흐르게 함)
  const tickerItems = STOCKS.map((s) =&gt; `&lt;span&gt;${s.emo} ${s.name} &lt;small style=&quot;color:#6f7ca3&quot;&gt;· ${s.sector}&lt;/small&gt;&lt;/span&gt;`).join(&quot;&quot;);
  $(&quot;ticker&quot;).innerHTML = tickerItems + `&lt;span&gt;💵 현금 보유 · 0%&lt;/span&gt;` + tickerItems + `&lt;span&gt;💵 현금 보유 · 0%&lt;/span&gt;`;
  $(&quot;rules&quot;).innerHTML = [
    `총 &lt;b&gt;${CFG.rounds}라운드&lt;/b&gt;, 라운드마다 뉴스 속보가 나와요. 같은 뉴스에서 같은 종목을 고르면 결과는 항상 같아요.`,
    `&lt;b&gt;연습 모드&lt;/b&gt;는 정답이 분명한 뉴스 ${PRACTICE_NEWS.length}개로 연습해요. 추가 도장과 순위는 없어요.`,
    `&lt;b&gt;하드 모드&lt;/b&gt;는 뉴스 ${HARD_NEWS.length}개 중에서 나오고, 순위와 추가 도장이 있어요.`,
    `&lt;b&gt;${CFG.timeLimit}초&lt;/b&gt; 안에 오를 것 같은 종목 1개 또는 현금 보유를 고르세요.`,
    `&lt;span class=&quot;up&quot;&gt;빨강 = 상승&lt;/span&gt;, &lt;span class=&quot;down&quot;&gt;파랑 = 하락&lt;/span&gt;`,
  ].map((t) =&gt; `&lt;li&gt;${t}&lt;/li&gt;`).join(&quot;&quot;);
  $(&quot;giftNote&quot;).textContent = `⭐ 하드 모드 최종 수익률 ${CFG.giftRate}% 이상이면 도장 1개 더! (연습 모드는 해당 없음)`;

  const choices = $(&quot;choices&quot;);
  STOCKS.forEach((s, i) =&gt; {
    const b = document.createElement(&quot;button&quot;);
    b.className = &quot;choice&quot;;
    b.innerHTML = `&lt;span class=&quot;key&quot;&gt;${i + 1}&lt;/span&gt;&lt;span class=&quot;emo&quot;&gt;${s.emo}&lt;/span&gt;&lt;span class=&quot;nm&quot;&gt;${s.name}&lt;/span&gt;&lt;span class=&quot;sec&quot;&gt;${s.sector}&lt;/span&gt;`;
    b.onclick = () =&gt; pick(s.id, false);
    choices.appendChild(b);
  });
  const cash = document.createElement(&quot;button&quot;);
  cash.className = &quot;choice cash&quot;;
  cash.innerHTML = &#x27;&lt;span class=&quot;key&quot;&gt;0&lt;/span&gt;&lt;span class=&quot;emo&quot;&gt;💵&lt;/span&gt;&lt;span class=&quot;nm&quot;&gt;현금 보유&lt;/span&gt;&lt;span class=&quot;sec&quot;&gt;수익 0%&lt;/span&gt;&#x27;;
  cash.onclick = () =&gt; pick(&quot;cash&quot;, false);
  choices.appendChild(cash);

  $(&quot;hardBtn&quot;).onclick = () =&gt; startGame(&quot;hard&quot;);
  $(&quot;practiceBtn&quot;).onclick = () =&gt; startGame(&quot;practice&quot;);
  $(&quot;nick&quot;).addEventListener(&quot;keydown&quot;, (e) =&gt; { if (e.key === &quot;Enter&quot; &amp;&amp; !e.isComposing) startGame(&quot;hard&quot;); });
  $(&quot;nextBtn&quot;).onclick = nextStep;
  $(&quot;againBtn&quot;).onclick = nextPlayer;
  $(&quot;csvBtn&quot;).onclick = openExport;
  $(&quot;copyBtn&quot;).onclick = copyExport;
  $(&quot;saveBtn&quot;).onclick = saveCsvFile;
  $(&quot;closeExportBtn&quot;).onclick = () =&gt; { $(&quot;exportPanel&quot;).hidden = true; };
  $(&quot;resetBtn&quot;).onclick = resetToday;
  $(&quot;soundBtn&quot;).onclick = (e) =&gt; { e.currentTarget.blur(); Sound.toggle(); };
  renderSoundBtn();
  setupAttract();

  // 키보드: 라운드 중 1~7 종목, 0 현금 / 결과 공개 후 Enter 다음
  document.addEventListener(&quot;keydown&quot;, (e) =&gt; {
    const active = document.querySelector(&quot;.screen.active&quot;).id;
    if ((e.key === &quot;m&quot; || e.key === &quot;M&quot; || e.key === &quot;ㅡ&quot;) &amp;&amp; !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) { Sound.toggle(); return; }
    if (active === &quot;round&quot; &amp;&amp; /^[0-7]$/.test(e.key)) {
      pick(e.key === &quot;0&quot; ? &quot;cash&quot; : STOCKS[Number(e.key) - 1].id, false);
    } else if (active === &quot;reveal&quot; &amp;&amp; e.key === &quot;Enter&quot; &amp;&amp; performance.now() - state.revealAt &gt; 700) {
      e.preventDefault();
      nextStep();
    }
  });

  refreshStart();
  $(&quot;nick&quot;).focus();
}

init();

    animation: deal .5s cubic-bezier(.2,.8,.3,1.2) both;
  }
  .back::before { content: &quot;☾&quot;; position: absolute; inset: 0; display: grid; place-items: center; color: #ffd978; font-size: calc(var(--cw) * .24); text-shadow: 0 0 8px rgba(255,210,110,.8); }
  .back::after {
    content: &quot;&quot;; position: absolute; inset: 0;
    background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.45) 50%, transparent 65%);
    transform: translateX(-120%); transition: transform .5s;
  }
  .back:hover:not(:disabled), .back:focus-visible { z-index: 200; transform: translate(var(--x), calc(var(--y) - 26px)) rotate(var(--rot)) scale(1.12);
                                                    box-shadow: 0 0 18px rgba(255,210,110,.8), 0 10px 24px rgba(0,0,0,.5); }
  .back:hover:not(:disabled)::after { transform: translateX(120%); }
  .back.chosen { z-index: 300; transform: translate(var(--x), calc(var(--y) - 40px)) rotate(var(--rot)) scale(1.16);
                 box-shadow: 0 0 0 3px var(--topic), 0 0 26px var(--topic), 0 12px 26px rgba(0,0,0,.5); }
  .back:disabled { cursor: default; }
  .back.dim { opacity: .28; filter: grayscale(.6); }
  /* 나눠 주는 애니메이션은 translate 속성만 써서 위치(transform)와 겹치지 않게 함 */
  @keyframes deal { from { opacity: 0; translate: 0 -60px; } to { opacity: 1; translate: 0 0; } }

  /* 결과 */
  .spread { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; margin-top: 22px; }
  .slot-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; min-width: 0; }
  .pos { font-weight: 800; color: var(--topic); font-size: 19px; }
  .slot { position: relative; width: 100%; max-width: 230px; aspect-ratio: 2 / 3; perspective: 1000px; cursor: pointer; border-radius: 16px; }
  .slot.open { cursor: default; }

  /* 카드 무늬별 색: s1 진한 색, s2 밝은 색, b1·b2 앞면 바탕 */
  [data-suit=&quot;major&quot;]     { --s1: #6d3df0; --s2: #ffd36e; --b1: #fff8e6; --b2: #eedcff; }
  [data-suit=&quot;wands&quot;]     { --s1: #e8501c; --s2: #ffc94d; --b1: #fff4e6; --b2: #ffd6bd; }
  [data-suit=&quot;cups&quot;]      { --s1: #138fc4; --s2: #8fe6ff; --b1: #effbff; --b2: #c6ebff; }
  [data-suit=&quot;swords&quot;]    { --s1: #4f5fcf; --s2: #cfd8ff; --b1: #f4f5ff; --b2: #d6dbfb; }
  [data-suit=&quot;pentacles&quot;] { --s1: #178a4e; --s2: #f2cf5b; --b1: #f2fbea; --b2: #cfeec0; }

  /* 뒤집힐 때 카드 뒤로 퍼지는 빛 */
  .aura {
    position: absolute; inset: -18%; border-radius: 50%; pointer-events: none; z-index: 0; opacity: 0;
    background: radial-gradient(closest-side, var(--s2), var(--s1) 45%, transparent 75%);
    filter: blur(6px);
  }
  .slot.open .aura { animation: aura-in 1.4s ease-out .35s forwards, aura-pulse 3s ease-in-out 1.8s infinite; }
  @keyframes aura-in { 0% { opacity: 0; transform: scale(.6); } 40% { opacity: .95; transform: scale(1.1); } 100% { opacity: .5; transform: scale(1); } }
  @keyframes aura-pulse { 0%, 100% { opacity: .5; } 50% { opacity: .8; } }

  .flip { position: relative; z-index: 1; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .8s cubic-bezier(.3,.7,.2,1); }
  .slot.open .flip { transform: rotateY(180deg); }
  .slot:not(.open):hover .flip { transform: translateY(-6px) rotateY(-8deg); }
  .face, .cover { position: absolute; inset: 0; border-radius: 16px; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }

  /* 결과 카드 뒷면 */
  .cover {
    border: 4px solid transparent;
    background:
      radial-gradient(circle at 50% 44%, rgba(255,214,120,.35) 0 14%, transparent 15%),
      radial-gradient(circle at 50% 44%, transparent 0 24%, rgba(255,214,120,.5) 25% 26%, transparent 27%),
      radial-gradient(circle at 50% 44%, transparent 0 32%, rgba(255,214,120,.25) 33% 34%, transparent 35%),
      repeating-linear-gradient(45deg, #2e1f66 0 10px, #251a55 10px 20px) padding-box,
      linear-gradient(135deg, #fff1b8, #c9922e 35%, #ffe7a0 55%, #a8741e) border-box;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 18%;
    color: #ffd978; font-size: 15px; font-weight: 800; box-shadow: 0 10px 30px rgba(0,0,0,.45);
  }
  .cover .moon { position: absolute; top: 44%; left: 50%; transform: translate(-50%, -50%); font-size: 52px; text-shadow: 0 0 18px rgba(255,210,110,.9); }
  .cover .tw { position: absolute; color: #ffe9a8; font-size: 14px; animation: twinkle 2.4s ease-in-out infinite; }
  .slot:not(.open) .cover { animation: breathe 2.2s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { box-shadow: 0 10px 30px rgba(0,0,0,.45), 0 0 0 rgba(255,210,110,0); } 50% { box-shadow: 0 10px 30px rgba(0,0,0,.45), 0 0 26px rgba(255,210,110,.55); } }

  /* 결과 카드 앞면 - 금박 테두리, 무늬별 색, 빛나는 메달 */
  .face {
    transform: rotateY(180deg); transition: transform .7s cubic-bezier(.4,.1,.2,1); color: #2b2140;
    border: 4px solid transparent;
    background:
      radial-gradient(120% 70% at 50% 0%, rgba(255,255,255,.9), transparent 60%) padding-box,
      linear-gradient(165deg, var(--b1), var(--b2)) padding-box,
      linear-gradient(135deg, #fff1b8, #c9922e 30%, #fff4c7 50%, #b07a20 70%, #ffe7a0) border-box;
    box-shadow: 0 12px 34px rgba(0,0,0,.5);
  }
  /* 역방향: 앞면으로 뒤집힌 뒤 카드 전체가 180° 돌아 거꾸로 놓임 */
  .slot.turned .face { transform: rotateY(180deg) rotateZ(180deg); }
  .frame {
    position: absolute; inset: 7px; border-radius: 10px; border: 2px solid var(--s1); outline: 1px solid var(--s2); outline-offset: -6px;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 12px 6px 10px;
  }
  .corner { position: absolute; color: var(--s1); font-size: 13px; line-height: 1; }
  .corner.tl { top: 4px; left: 5px; } .corner.tr { top: 4px; right: 5px; }
  .corner.bl { bottom: 4px; left: 5px; } .corner.br { bottom: 4px; right: 5px; }
  .face .no {
    font-weight: 900; letter-spacing: 2px; font-size: 15px; color: #fff; padding: 3px 18px;
    background: linear-gradient(180deg, var(--s1), #2b2140); text-shadow: 0 1px 2px rgba(0,0,0,.4);
    clip-path: polygon(0 0, 100% 0, 92% 50%, 100% 100%, 0 100%, 8% 50%);
  }
  .medal { position: relative; width: 64%; aspect-ratio: 1; display: grid; place-items: center; }
  .medal::before {
    content: &quot;&quot;; position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle, #fff 0 35%, var(--b1) 60%, var(--b2) 100%);
    box-shadow: 0 0 0 3px var(--s2), 0 0 0 5px var(--s1), 0 0 22px var(--s1), inset 0 0 18px rgba(255,255,255,.9);
  }
  .rays {
    position: absolute; inset: -22%; border-radius: 50%;
    background: repeating-conic-gradient(var(--s2) 0 5deg, transparent 5deg 15deg);
    -webkit-mask-image: radial-gradient(circle, #000 35%, transparent 70%); mask-image: radial-gradient(circle, #000 35%, transparent 70%);
    opacity: .8; animation: spin 16s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .face .emo { position: relative; font-size: 58px; filter: drop-shadow(0 4px 6px rgba(0,0,0,.25)); }
  .slot.open .face .emo { animation: pop .7s cubic-bezier(.2,.9,.3,1.4) .45s both; }
  @keyframes pop { from { transform: scale(.3) rotate(-20deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .plate { text-align: center; }
  .suit { font-size: 11px; font-weight: 800; letter-spacing: 1px; color: var(--s1); }
  .face .nm { font-weight: 900; font-size: 22px; line-height: 1.2; }
  .face .nm.long { font-size: 19px; }
  .face .en { font-size: 12px; color: #6f6488; font-style: italic; }
  /* 반짝 지나가는 빛 */
  .shine {
    position: absolute; inset: 0; pointer-events: none; mix-blend-mode: soft-light;
    background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.95) 45%, rgba(255,240,200,.6) 50%, transparent 62%);
    background-size: 250% 100%; background-position: 150% 0;
  }
  .slot.open .shine { animation: shine 4.5s ease-in-out .7s infinite; }
  @keyframes shine { 0% { background-position: 150% 0; } 35%, 100% { background-position: -60% 0; } }
  /* 뒤집을 때 튀어나오는 별가루 */
  .spark { position: absolute; left: 50%; top: 50%; z-index: 3; pointer-events: none; font-size: var(--sz); color: var(--c);
           text-shadow: 0 0 8px var(--c); animation: fly 1s cubic-bezier(.1,.7,.3,1) forwards; }
  @keyframes fly {
    0% { transform: translate(-50%, -50%) scale(.2); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1) rotate(var(--rot)); opacity: 0; }
  }
  @keyframes twinkle { 0%, 100% { opacity: .2; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.1); } }

  /* 정방향 / 역방향 표시 */
  .orient { visibility: hidden; font-size: 14px; font-weight: 800; padding: 6px 14px; border-radius: 999px; backdrop-filter: blur(4px); }
  .orient.show { visibility: visible; animation: rise .45s ease both; }
  .orient.up { background: rgba(80,200,130,.14); color: #a6f0c0; border: 1px solid rgba(120,230,160,.4); }
  .orient.rev { background: rgba(255,110,160,.14); color: #ffbfd3; border: 1px solid rgba(255,140,180,.45); }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* 카드 해석 칸 */
  .reading {
    position: relative; overflow: hidden; width: 100%; min-height: 176px; line-height: 1.6; padding: 18px 18px 16px; border-radius: 18px;
    background: linear-gradient(180deg, rgba(46,36,94,.88), rgba(26,20,56,.88)); border: 1px solid rgba(255,255,255,.08);
    box-shadow: 0 10px 26px rgba(0,0,0,.3);
  }
  .reading .tap { height: 140px; display: grid; place-items: center; color: var(--muted); border: 1.5px dashed rgba(169,159,204,.35); border-radius: 12px;
                  animation: nudge 2.4s ease-in-out infinite; }
  @keyframes nudge { 0%, 100% { opacity: .65; } 50% { opacity: 1; } }
  .reading.done { border-color: rgba(255,255,255,.14); box-shadow: 0 0 0 1px var(--s1) inset, 0 0 26px rgba(0,0,0,.25), 0 10px 26px rgba(0,0,0,.3); }
  .reading.done::before { content: &quot;&quot;; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: linear-gradient(90deg, var(--s1), var(--s2), var(--s1)); }
  .reading.done::after { content: &quot;&quot;; position: absolute; right: -40px; top: -40px; width: 140px; height: 140px; border-radius: 50%;
                         background: radial-gradient(closest-side, var(--s1), transparent); opacity: .28; pointer-events: none; }
  .reading.done &gt; * { animation: rise .5s ease both; }
  .reading.done &gt; *:nth-child(2) { animation-delay: .08s; } .reading.done &gt; *:nth-child(3) { animation-delay: .16s; } .reading.done &gt; *:nth-child(4) { animation-delay: .24s; }
  .reading .title { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 19px; }
  .reading .badge-emo { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 22px;
                        background: radial-gradient(circle, #fff 0 30%, var(--b2) 75%); box-shadow: 0 0 0 2px var(--s2), 0 0 0 3.5px var(--s1), 0 0 14px var(--s1); }
  .reading .dir { margin-left: auto; font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 999px; }
  .reading .dir.up { background: rgba(80,200,130,.18); color: #a6f0c0; }
  .reading .dir.rev { background: rgba(255,110,160,.18); color: #ffbfd3; }
  .reading .kws { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 10px; }
  .reading .kws span { font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; color: #fff; background: rgba(255,255,255,.08); border: 1px solid var(--s1); }
  .reading .msg { font-size: 17px; color: #f6f1ff; }
  .reading .revnote { margin-top: 10px; padding: 8px 10px; border-radius: 10px; background: rgba(255,110,160,.08); color: #d9cdee; font-size: 13.5px; }

  /* 종합 운세 */
  .summary {
    position: relative; margin-top: 30px; padding: 34px 28px 26px; border-radius: 26px; text-align: center; border: 2px solid transparent;
    background: linear-gradient(180deg, #2a2158, #1a1438) padding-box, linear-gradient(135deg, var(--topic), #ffd36e 30%, #fff3c4 50%, #ffd36e 70%, var(--topic)) border-box; /* 예전 브라우저용 */
    background:
      radial-gradient(90% 60% at 50% 0%, color-mix(in srgb, var(--topic) 22%, transparent), transparent 70%) padding-box,
      linear-gradient(180deg, #2a2158, #1a1438) padding-box,
      linear-gradient(135deg, var(--topic), #ffd36e 30%, #fff3c4 50%, #ffd36e 70%, var(--topic)) border-box;
    background-size: 100% 100%, 100% 100%, 300% 300%;
    box-shadow: 0 16px 40px rgba(0,0,0,.4);
    animation: rise .6s ease both;
  }
  .summary.jackpot { animation: rise .6s ease both, border-flow 3s linear infinite, jackpot 2s ease-in-out infinite; }
  @keyframes border-flow { to { background-position: 0 0, 0 0, 300% 0; } }
  @keyframes jackpot { 0%, 100% { box-shadow: 0 16px 40px rgba(0,0,0,.4), 0 0 0 rgba(255,211,110,0); } 50% { box-shadow: 0 16px 40px rgba(0,0,0,.4), 0 0 46px rgba(255,211,110,.55); } }
  .summary .cn { position: absolute; color: #e8c372; font-size: 16px; opacity: .8; }
  .summary .cn.tl { top: 12px; left: 16px; } .summary .cn.tr { top: 12px; right: 16px; } .summary .cn.bl { bottom: 12px; left: 16px; } .summary .cn.br { bottom: 12px; right: 16px; }
  .sum-ico { --c: var(--topic); --cg: color-mix(in srgb, var(--topic) 35%, transparent); width: 84px; height: 84px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center;
             background: radial-gradient(circle, var(--cg), transparent 70%); box-shadow: 0 0 0 1px var(--cg) inset; }
  .sum-ico .ico { width: 50px; height: 50px; color: var(--topic); filter: drop-shadow(0 0 10px var(--topic)); overflow: visible; }
  .sum-ico .ico .fill { fill: var(--cg); } .sum-ico .ico .tw { fill: #fff; }
  .sum-sub { margin-top: 8px; font-size: 12px; font-weight: 800; letter-spacing: 5px; color: #e8c372; }
  .summary h2 { margin: 4px 0 6px; font-size: 32px; }
  .stars { font-size: 46px; color: #5c5185; letter-spacing: 6px; line-height: 1.2; }
  .stars .st { display: inline-block; animation: star-in .55s cubic-bezier(.2,.9,.3,1.5) both; }
  .stars .st.on { color: #ffd36e; text-shadow: 0 0 16px rgba(255,211,110,.9), 0 0 4px #fff3c4; }
  @keyframes star-in { from { transform: scale(0) rotate(-120deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .star-meta { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 4px; }
  .star-meta .num { font-size: 17px; color: var(--muted); font-weight: 700; }
  .star-meta .badge { font-size: 15px; padding: 5px 14px; border-radius: 999px; background: linear-gradient(90deg, #ffd36e, #ff9fc6); color: #3a1d00; font-weight: 900;
                      animation: star-in .6s cubic-bezier(.2,.9,.3,1.5) 1.1s both; }
  .divider { display: flex; align-items: center; gap: 12px; margin: 18px auto 14px; max-width: 420px; color: #e8c372; font-size: 13px; }
  .divider::before, .divider::after { content: &quot;&quot;; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(232,195,114,.7), transparent); }
  .quote { position: relative; max-width: 720px; margin: 0 auto; font-size: 21px; line-height: 1.7; font-weight: 700; color: #fbf7ff; padding: 0 28px; }
  .quote::before, .quote::after { position: absolute; font-size: 54px; line-height: 1; color: var(--topic); opacity: .5; font-family: Georgia, serif; }
  .quote::before { content: &quot;“&quot;; left: 0; top: -8px; } .quote::after { content: &quot;”&quot;; right: 0; bottom: -30px; }
  .notes { max-width: 720px; margin: 16px auto 0; display: grid; gap: 8px; text-align: left; }
  .notes p { margin: 0; padding: 10px 14px; border-radius: 12px; background: rgba(255,255,255,.05); font-size: 16px; line-height: 1.6; color: #ddd3f3; }
  .best { display: flex; align-items: center; gap: 14px; max-width: 720px; margin: 10px auto 0; padding: 12px 16px; border-radius: 16px; text-align: left;
          background: rgba(255,255,255,.05); border: 1px solid var(--s1); /* 예전 브라우저용 */
          background: linear-gradient(90deg, color-mix(in srgb, var(--s1) 22%, transparent), rgba(255,255,255,.03)); border: 1px solid color-mix(in srgb, var(--s1) 60%, transparent); }
  .best .badge-emo { flex: none; width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; font-size: 30px;
                     background: radial-gradient(circle, #fff 0 30%, var(--b2) 75%); box-shadow: 0 0 0 2px var(--s2), 0 0 0 4px var(--s1), 0 0 18px var(--s1); }
  .best small { display: block; font-size: 12px; font-weight: 800; letter-spacing: 2px; color: #e8c372; }
  .best b { font-size: 19px; } .best span { display: block; color: #d9cdee; font-size: 15px; }
  .lucky { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 720px; margin: 16px auto 0; }
  .lucky &gt; div { padding: 14px 10px 12px; border-radius: 16px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); animation: rise .5s ease both; }
  .lucky &gt; div:nth-child(2) { animation-delay: .1s; } .lucky &gt; div:nth-child(3) { animation-delay: .2s; }
  .lucky .lk-ico { width: 44px; height: 44px; margin: 0 auto 6px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; font-weight: 900; }
  .lucky .swatch { background: var(--sw); box-shadow: 0 0 0 3px rgba(255,255,255,.18), 0 0 16px var(--sw); }
  .lucky .coin { color: #5a3b00; background: radial-gradient(circle at 35% 30%, #fff3c4, #ffd36e 45%, #c9922e); box-shadow: 0 0 0 3px rgba(255,211,110,.3), 0 0 16px rgba(255,211,110,.6); }
  .lucky .gift { background: radial-gradient(circle, color-mix(in srgb, var(--topic) 40%, transparent), transparent 75%); box-shadow: 0 0 0 1px var(--topic) inset; }
  .lucky b { display: block; color: var(--topic); font-size: 13px; letter-spacing: 1px; margin-bottom: 2px; }
  .lucky .val { font-size: 17px; font-weight: 800; }

  /* 결과 화면 머리 &amp; 위치 이름 */
  .pos { display: flex; align-items: center; gap: 8px; font-weight: 800; color: var(--topic); font-size: 19px; }
  .pos .pn { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; font-weight: 900; color: #3a2600;
             background: radial-gradient(circle at 35% 30%, #fff3c4, #ffd36e 50%, #c9922e); box-shadow: 0 0 12px rgba(255,211,110,.5); }
  .guide .gl { color: #e8c372; margin: 0 8px; font-size: 18px; }

  @media (max-width: 860px) {
    .topics, .spread { grid-template-columns: 1fr; }
    .hero h1 { font-size: 46px; }
    .stage { height: 230px; }
    .orb { width: 180px; margin-left: -90px; }
    .mini { width: 62px; height: 93px; margin-left: -31px; --k: .72; }
    .mini.o { display: none; }
    .constel { display: none; }
    .lucky { grid-template-columns: 1fr; }
    .summary { padding: 30px 16px 22px; }
    .quote { font-size: 18px; padding: 0 22px; }
    .stars { font-size: 38px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div class=&quot;aurora&quot; aria-hidden=&quot;true&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;/div&gt;
&lt;div class=&quot;wrap&quot;&gt;

  &lt;!-- 시작: 운세 고르기 --&gt;
  &lt;section id=&quot;start&quot; class=&quot;screen active&quot;&gt;
    &lt;div class=&quot;hero&quot;&gt;

// 받침이 있으면 &quot;이에요&quot;, 없으면 &quot;예요&quot; (예: 별이에요, 바보예요, 컵 10이에요)
const ieyo = (word) =&gt; {
  const last = word[word.length - 1];
  if (/[0-9]/.test(last)) return &quot;0136789&quot;.includes(last) ? &quot;이에요&quot; : &quot;예요&quot;;  // 영·일·삼·육·칠·팔 / 이·사·오·구
  const code = word.charCodeAt(word.length - 1) - 0xac00;
  return code &gt;= 0 &amp;&amp; code &lt;= 11171 &amp;&amp; code % 28 !== 0 ? &quot;이에요&quot; : &quot;예요&quot;;
};

function shuffle(arr) {
  for (let i = arr.length - 1; i &gt; 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function show(id) {
  document.querySelectorAll(&quot;.screen&quot;).forEach((s) =&gt; s.classList.toggle(&quot;active&quot;, s.id === id));
  window.scrollTo(0, 0);
}

let state = null;

// ---------- 1. 운세 고르기 ----------
function chooseTopic(key) {
  const t = TOPICS[key];
  document.body.dataset.topic = key;
  state = { topic: key, deck: shuffle(CARDS.map((_, i) =&gt; i)), chosen: [] };
  $(&quot;pickTopic&quot;).textContent = `${t.emo} ${t.name}`;
  $(&quot;posGuide&quot;).textContent = t.positions.join(&quot; → &quot;);
  show(&quot;pick&quot;);
  renderDeck();
}

// ---------- 2. 카드 고르기 ----------
function renderDeck() {
  $(&quot;pickCount&quot;).textContent = `${state.chosen.length} / ${PICK}장 선택`;
  $(&quot;deck&quot;).innerHTML = &quot;&quot;;
  state.deck.forEach((cardIdx, i) =&gt; {
    const b = document.createElement(&quot;button&quot;);
    b.className = &quot;back&quot;;
    b.style.animationDelay = `${i * 0.012}s`;
    b.setAttribute(&quot;aria-label&quot;, `${i + 1}번째 카드`);
    b.onclick = () =&gt; chooseCard(b, cardIdx);
    $(&quot;deck&quot;).appendChild(b);
  });
  layoutDeck();
}

// 카드를 여러 줄의 부채꼴(가운데가 위로 볼록)로 겹쳐 펼침. 화면이 좁으면 줄 수를 늘림
function layoutDeck() {
  const deck = $(&quot;deck&quot;);
  const cards = [...deck.children];
  if (!cards.length) return;
  const W = Math.min(deck.parentElement.clientWidth, 1060);
  const rows = W &lt; 520 ? 6 : W &lt; 860 ? 4 : 3;
  const per = Math.ceil(cards.length / rows);
  const cw = Math.max(44, Math.min(92, W / (per * 0.42 + 1)));
  const ch = cw * 1.5, depth = cw * 0.45, rowGap = ch * 0.78 + depth * 0.4;
  const pad = cw * 0.35, top = 50;                         // 기울어진 끝 카드·뽑힌 카드가 밖으로 나가지 않게 여백
  deck.style.width = W + &quot;px&quot;;
  deck.style.height = top + (rows - 1) * rowGap + ch + depth + 10 + &quot;px&quot;;
  deck.style.setProperty(&quot;--cw&quot;, cw + &quot;px&quot;);
  cards.forEach((b, i) =&gt; {
    const r = Math.floor(i / per), j = i % per;
    const n = Math.min(per, cards.length - r * per);
    const t = n &gt; 1 ? (j / (n - 1)) * 2 - 1 : 0;           // 줄 안에서 -1(왼쪽) ~ 1(오른쪽)
    const step = n &gt; 1 ? (W - cw - pad * 2) / (n - 1) : 0;
    b.style.setProperty(&quot;--x&quot;, pad + j * step + &quot;px&quot;);
    b.style.setProperty(&quot;--y&quot;, top + r * rowGap + t * t * depth + &quot;px&quot;);
    b.style.setProperty(&quot;--rot&quot;, t * 16 + &quot;deg&quot;);
  });
}
window.addEventListener(&quot;resize&quot;, () =&gt; { if (state &amp;&amp; $(&quot;pick&quot;).classList.contains(&quot;active&quot;)) layoutDeck(); });

function chooseCard(btn, cardIdx) {
  if (state.chosen.length &gt;= PICK || btn.classList.contains(&quot;chosen&quot;)) return;
  btn.classList.add(&quot;chosen&quot;);
  btn.disabled = true;
  // 정방향 / 역방향은 고르는 순간 정해짐
  state.chosen.push({ idx: cardIdx, reversed: Math.random() &lt; REV_RATE, open: false });
  $(&quot;pickCount&quot;).textContent = `${state.chosen.length} / ${PICK}장 선택`;
  if (state.chosen.length === PICK) {
    document.querySelectorAll(&quot;.back:not(.chosen)&quot;).forEach((b) =&gt; { b.disabled = true; b.classList.add(&quot;dim&quot;); });
    setTimeout(showSpread, 700);
  }
}
