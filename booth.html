// 카드 열기: ① 앞면으로 뒤집기(0.8초) → ② 역방향이면 카드가 180° 돌아 거꾸로 놓임(0.7초) → ③ 해석 표시
const FLIP_MS = 800, TURN_MS = 700;

function openCard(i) {
  const c = state.chosen[i];
  if (c.open) return;
  c.open = true;
  const slot = $(&quot;slot&quot; + i);
  slot.classList.add(&quot;open&quot;);
  slot.setAttribute(&quot;aria-disabled&quot;, &quot;true&quot;);
  const sc = getComputedStyle(slot);
  setTimeout(() =&gt; burst(slot, 20, [sc.getPropertyValue(&quot;--s1&quot;), sc.getPropertyValue(&quot;--s2&quot;), &quot;#fff3c4&quot;, &quot;#ffd36e&quot;]), FLIP_MS * 0.45);
  if (c.reversed) setTimeout(() =&gt; slot.classList.add(&quot;turned&quot;), FLIP_MS);
  setTimeout(() =&gt; showReading(i), c.reversed ? FLIP_MS + TURN_MS : FLIP_MS * 0.6);
}

function showReading(i) {
  const c = state.chosen[i];
  const card = CARDS[c.idx];
  const d = c.reversed ? 1 : 0;
  const orient = $(&quot;orient&quot; + i);
  orient.className = &quot;orient show &quot; + (c.reversed ? &quot;rev&quot; : &quot;up&quot;);
  orient.textContent = c.reversed ? &quot;🔄 역방향 · 카드가 거꾸로 나왔어요&quot; : &quot;⬆️ 정방향&quot;;
  $(&quot;reading&quot; + i).classList.add(&quot;done&quot;);
  $(&quot;reading&quot; + i).innerHTML =
    `&lt;div class=&quot;title&quot;&gt;&lt;span class=&quot;badge-emo&quot;&gt;${card.emo}&lt;/span&gt;${card.name}&lt;span class=&quot;dir ${c.reversed ? &quot;rev&quot; : &quot;up&quot;}&quot;&gt;${c.reversed ? &quot;역방향&quot; : &quot;정방향&quot;}&lt;/span&gt;&lt;/div&gt;` +
    `&lt;div class=&quot;kws&quot;&gt;${card.key[d].split(&quot;, &quot;).map((k) =&gt; `&lt;span&gt;${k}&lt;/span&gt;`).join(&quot;&quot;)}&lt;/div&gt;` +
    `&lt;div class=&quot;msg&quot;&gt;${card[state.topic][d]}&lt;/div&gt;` +
    (c.reversed
      ? `&lt;div class=&quot;revnote&quot;&gt;🔄 역방향은 카드의 뜻이 약해지거나 반대로 바뀐다는 의미예요. (정방향일 때: ${card.key[0]})&lt;/div&gt;`
      : &quot;&quot;);
  c.done = true;
  if (state.chosen.every((x) =&gt; x.done)) showSummary();
}

// 별가루 터뜨리기: el 가운데에서 n개의 별이 사방으로 퍼짐
function burst(el, n, colors) {
  if (matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;).matches) return;
  for (let k = 0; k &lt; n; k++) {
    const s = document.createElement(&quot;span&quot;);
    const ang = Math.random() * Math.PI * 2, dist = 70 + Math.random() * 110;
    s.className = &quot;spark&quot;;
    s.textContent = randomOf([&quot;✦&quot;, &quot;★&quot;, &quot;✧&quot;, &quot;•&quot;]);
    s.style.setProperty(&quot;--dx&quot;, `${Math.cos(ang) * dist}px`);
    s.style.setProperty(&quot;--dy&quot;, `${Math.sin(ang) * dist}px`);
    s.style.setProperty(&quot;--rot&quot;, `${Math.random() * 360}deg`);
    s.style.setProperty(&quot;--sz&quot;, `${10 + Math.random() * 16}px`);
    s.style.setProperty(&quot;--c&quot;, randomOf(colors).trim() || &quot;#ffd36e&quot;);
    el.appendChild(s);
    setTimeout(() =&gt; s.remove(), 1100);
  }
}

function openAll() {
  state.chosen.forEach((_, i) =&gt; setTimeout(() =&gt; openCard(i), i * 350));
}

// ---------- 4. 종합 운세 ----------
function showSummary() {
  const t = TOPICS[state.topic];
  const scores = state.chosen.map((c) =&gt; CARDS[c.idx].score[c.reversed ? 1 : 0]);
  const total = scores.reduce((a, b) =&gt; a + b, 0);
  const fives = scores.filter((x) =&gt; x === 5).length;
  // 0~3개: 점수 합계가 STAR_CUTS 의 기준을 넘을 때마다 별 1개
  let stars = STAR_CUTS.filter((cut) =&gt; total &gt; cut).length;
  // 4~5개: 5점 카드 수 + 합계 조건
  if (fives &gt;= STAR4[0] &amp;&amp; total &gt;= STAR4[1]) stars = 4;
  if (fives &gt;= STAR5[0] &amp;&amp; total &gt;= STAR5[1]) stars = 5;
  const tier = stars &lt;= 1 ? 0 : stars &lt;= 3 ? 1 : 2;
  const revCount = state.chosen.filter((c) =&gt; c.reversed).length;
  const best = state.chosen.reduce((a, c) =&gt; (CARDS[c.idx].score[c.reversed ? 1 : 0] &gt; CARDS[a.idx].score[a.reversed ? 1 : 0] ? c : a));
  const bestCard = CARDS[best.idx];
  const color = randomOf(t.lucky_colors);
  $(&quot;summary&quot;).innerHTML =
    `&lt;span class=&quot;cn tl&quot;&gt;✦&lt;/span&gt;&lt;span class=&quot;cn tr&quot;&gt;✦&lt;/span&gt;&lt;span class=&quot;cn bl&quot;&gt;✦&lt;/span&gt;&lt;span class=&quot;cn br&quot;&gt;✦&lt;/span&gt;` +
    `&lt;div class=&quot;sum-ico&quot;&gt;${TOPIC_ICON[state.topic]}&lt;/div&gt;` +
    `&lt;div class=&quot;sum-sub&quot;&gt;TODAY&#x27;S FORTUNE&lt;/div&gt;` +
    `&lt;h2&gt;오늘의 ${t.name}&lt;/h2&gt;` +
    `&lt;div class=&quot;stars&quot; aria-label=&quot;별 5개 중 ${stars}개&quot;&gt;` +
      [0, 1, 2, 3, 4].map((k) =&gt; `&lt;span class=&quot;st ${k &lt; stars ? &quot;on&quot; : &quot;&quot;}&quot; style=&quot;animation-delay:${0.2 + k * 0.18}s&quot;&gt;${k &lt; stars ? &quot;★&quot; : &quot;☆&quot;}&lt;/span&gt;`).join(&quot;&quot;) +
    `&lt;/div&gt;` +
    `&lt;div class=&quot;star-meta&quot;&gt;&lt;span class=&quot;num&quot;&gt;${stars} / 5&lt;/span&gt;${stars === 5 ? `&lt;span class=&quot;badge&quot;&gt;✨ 대박 운세!&lt;/span&gt;` : stars === 4 ? `&lt;span class=&quot;badge&quot;&gt;🍀 아주 좋아요&lt;/span&gt;` : &quot;&quot;}&lt;/div&gt;` +
    `&lt;div class=&quot;divider&quot;&gt;✦ ☾ ✦&lt;/div&gt;` +
    `&lt;div class=&quot;quote&quot;&gt;${t.summary[tier]}&lt;/div&gt;` +
    ((stars === 0 || revCount) ? `&lt;div class=&quot;notes&quot;&gt;` +
      (stars === 0 ? `&lt;p&gt;🌱 별이 하나도 없는 날은 아주 드물어요! 오늘이 바닥이라면 내일부터는 올라갈 일만 남았다는 뜻이에요.&lt;/p&gt;` : &quot;&quot;) +
      (revCount ? `&lt;p&gt;🔄 거꾸로 나온 카드가 &lt;b&gt;${revCount}장&lt;/b&gt; 있어요. 역방향 카드의 말은 &#x27;조심하면 좋아진다&#x27;는 신호로 받아들이세요.&lt;/p&gt;` : &quot;&quot;) +
    `&lt;/div&gt;` : &quot;&quot;) +
    `&lt;div class=&quot;best&quot; data-suit=&quot;${bestCard.suit}&quot;&gt;&lt;span class=&quot;badge-emo&quot;&gt;${bestCard.emo}&lt;/span&gt;` +
      `&lt;div&gt;&lt;small&gt;가장 힘이 되는 카드&lt;/small&gt;&lt;b&gt;${bestCard.name}&lt;/b&gt;&lt;span&gt;${bestCard.key[best.reversed ? 1 : 0]}의 기운을 기억하세요.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;` +
    `&lt;div class=&quot;lucky&quot;&gt;` +
      `&lt;div&gt;&lt;div class=&quot;lk-ico swatch&quot; style=&quot;--sw:${COLOR_HEX[color] || &quot;#ffd36e&quot;}&quot;&gt;&lt;/div&gt;&lt;b&gt;행운의 색&lt;/b&gt;&lt;span class=&quot;val&quot;&gt;${color}&lt;/span&gt;&lt;/div&gt;` +
      `&lt;div&gt;&lt;div class=&quot;lk-ico coin&quot;&gt;${1 + Math.floor(Math.random() * 9)}&lt;/div&gt;&lt;b&gt;행운의 숫자&lt;/b&gt;&lt;span class=&quot;val&quot;&gt;오늘의 숫자&lt;/span&gt;&lt;/div&gt;` +
      `&lt;div&gt;&lt;div class=&quot;lk-ico gift&quot;&gt;🎁&lt;/div&gt;&lt;b&gt;행운의 아이템&lt;/b&gt;&lt;span class=&quot;val&quot;&gt;${randomOf(t.lucky_items)}&lt;/span&gt;&lt;/div&gt;` +
    `&lt;/div&gt;`;
  $(&quot;summary&quot;).classList.toggle(&quot;jackpot&quot;, stars === 5);
  $(&quot;summary&quot;).hidden = false;
  if (stars &gt;= 4) setTimeout(() =&gt; burst($(&quot;summary&quot;), stars === 5 ? 40 : 22, [&quot;#ffd36e&quot;, &quot;#ff8fb8&quot;, &quot;#8fe6ff&quot;, &quot;#b9a4ff&quot;, &quot;#9ff0b0&quot;]), 300);
  $(&quot;endBtns&quot;).hidden = false;
  $(&quot;openAllBtn&quot;).hidden = true;
  setTimeout(() =&gt; $(&quot;summary&quot;).scrollIntoView({ behavior: &quot;smooth&quot;, block: &quot;nearest&quot; }), 200);
}

// ---------- 시작 ----------

    `&lt;button class=&quot;topic ${k}&quot; data-key=&quot;${k}&quot;&gt;&lt;span class=&quot;halo&quot;&gt;${TOPIC_ICON[k]}&lt;/span&gt;&lt;span class=&quot;nm&quot;&gt;${t.name}&lt;/span&gt;&lt;span class=&quot;ds&quot;&gt;${t.desc}&lt;/span&gt;&lt;span class=&quot;go&quot;&gt;카드 뽑기 →&lt;/span&gt;&lt;/button&gt;`
  ).join(&quot;&quot;);
  document.querySelectorAll(&quot;.topic&quot;).forEach((b) =&gt; { b.onclick = () =&gt; chooseTopic(b.dataset.key); });
  $(&quot;backBtn&quot;).onclick = () =&gt; show(&quot;start&quot;);
  $(&quot;homeBtn&quot;).onclick = () =&gt; { delete document.body.dataset.topic; show(&quot;start&quot;); };
  $(&quot;againBtn&quot;).onclick = () =&gt; chooseTopic(state.topic);
  $(&quot;openAllBtn&quot;).onclick = openAll;
}
init();
&lt;/script&gt;
&lt;/body&gt;

<script>

    ids.forEach((g) => {
