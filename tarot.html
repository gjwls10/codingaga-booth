<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 타로</title>
<style>
  :root {
    --bg: #130f26;
    --panel: #1f1840;
    --panel2: #2a2154;
    --line: #3d3270;
    --text: #f3eefe;
    --muted: #a99fcc;
    --gold: #e8c372;
    --topic: #e8c372;          /* 고른 운세의 색 (아래에서 바뀜) */
    --card-face: #fbf6ea;
    --card-ink: #2b2140;
    color-scheme: dark;
  }
  body[data-topic="love"]  { --topic: #ff8fb8; }
  body[data-topic="study"] { --topic: #7cc0ff; }
  body[data-topic="money"] { --topic: #8fe0a0; }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; overflow-x: hidden; }
  body {
    background: radial-gradient(1200px 600px at 50% -10%, #2b2160 0%, var(--bg) 60%) fixed, var(--bg);
    color: var(--text);
    font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    font-size: 18px;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      radial-gradient(1.5px 1.5px at 8% 12%, #fff, transparent), radial-gradient(1px 1px at 22% 68%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 37% 28%, #ffe9a8, transparent), radial-gradient(1px 1px at 51% 82%, #fff, transparent),
      radial-gradient(2px 2px at 64% 18%, #fff, transparent), radial-gradient(1px 1px at 76% 54%, #ffe9a8, transparent),
      radial-gradient(1.5px 1.5px at 88% 30%, #fff, transparent), radial-gradient(1px 1px at 94% 88%, #fff, transparent),
      radial-gradient(1px 1px at 14% 44%, #ffe9a8, transparent), radial-gradient(1.5px 1.5px at 45% 6%, #fff, transparent);
    animation: sky 5s ease-in-out infinite alternate;
  }
  @keyframes sky { from { opacity: .45; } to { opacity: 1; } }
  .wrap { position: relative; z-index: 1; }
  .aurora { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .aurora i { position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%; animation: drift 22s ease-in-out infinite alternate; }
  .aurora i:nth-child(1) { left: -25vmax; top: -30vmax; background: radial-gradient(closest-side, rgba(123,77,255,.32), transparent); }
  .aurora i:nth-child(2) { right: -30vmax; top: -10vmax; background: radial-gradient(closest-side, rgba(255,111,177,.18), transparent); animation-duration: 28s; }
  .aurora i:nth-child(3) { left: 10vmax; bottom: -45vmax; background: radial-gradient(closest-side, rgba(63,184,255,.16), transparent); animation-duration: 34s; }
  @keyframes drift { from { transform: translate(0, 0) scale(1); } to { transform: translate(6vmax, 4vmax) scale(1.12); } }
  button { font: inherit; cursor: pointer; }
  [hidden] { display: none !important; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 20px 48px; }
  .screen { display: none; }
  .screen.active { display: block; animation: fade .3s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .btn { position: relative; overflow: hidden; border: 0; border-radius: 999px; padding: 14px 28px; font-weight: 900; font-size: 20px; color: #3a2600;
         background: linear-gradient(180deg, #fff1b8, #ffd36e 45%, #d9a441); box-shadow: 0 6px 18px rgba(255,200,90,.35), inset 0 1px 0 rgba(255,255,255,.7);
         transition: transform .15s, box-shadow .2s; }
  .btn::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.55) 50%, transparent 65%);
                transform: translateX(-120%); transition: transform .6s; }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(255,200,90,.45), inset 0 1px 0 rgba(255,255,255,.7); }
  .btn:hover::after { transform: translateX(120%); }
  .btn.ghost { color: #e6ddff; font-weight: 700; background: rgba(255,255,255,.06); border: 1px solid rgba(232,195,114,.45); box-shadow: none; backdrop-filter: blur(4px); }
  .btn.ghost:hover { background: rgba(255,255,255,.1); box-shadow: 0 0 18px rgba(232,195,114,.3); }
  .btn:focus-visible, .topic:focus-visible, .back:focus-visible, .slot:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .center { text-align: center; }
  .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 24px; }

  /* 시작 화면 */
  #start.screen.active { display: flex; flex-direction: column; justify-content: center; min-height: calc(100vh - 72px); position: relative; }
  .hero { text-align: center; padding: 6px 0 0; position: relative; }
  .eyebrow { font-size: 14px; font-weight: 800; letter-spacing: 7px; color: #e8c372; opacity: .9; }
  .eyebrow::before, .eyebrow::after { content: ""; display: inline-block; width: 46px; height: 1px; vertical-align: middle; margin: 0 12px;
                                       background: linear-gradient(90deg, transparent, #e8c372); }
  .eyebrow::after { transform: scaleX(-1); }
  /* 별자리 장식 */
  .constel { position: absolute; width: 170px; opacity: .55; pointer-events: none; }
  .constel.l { left: -10px; top: 40px; } .constel.r { right: -10px; top: 150px; transform: scaleX(-1); }
  .constel line { stroke: #ffe9a8; stroke-width: 1; stroke-opacity: .5; }
  .constel circle { fill: #fff6d6; animation: twinkle 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .constel circle:nth-child(2n) { animation-delay: -1.5s; }
  /* 수정구슬 무대 */
  .stage { position: relative; height: 270px; width: 600px; max-width: 100%; margin: 8px auto 0; }
  .orb { position: absolute; left: 50%; bottom: 0; width: 210px; margin-left: -105px; z-index: 3; }
  .orb::before {
    content: ""; position: absolute; left: 50%; top: 42%; width: 330px; height: 330px; margin: -165px 0 0 -165px; border-radius: 50%; z-index: -1;
    background: radial-gradient(closest-side, rgba(190,140,255,.6), rgba(255,120,200,.18) 55%, transparent 75%);
    animation: glow 3.4s ease-in-out infinite;
  }
  .orb svg { display: block; width: 100%; height: auto; overflow: visible; }
  .orb .ball-g { animation: float 4.5s ease-in-out infinite; }
  .orb .nebula { transform-origin: 110px 100px; animation: spin 14s linear infinite; }
  .orb .nebula2 { transform-origin: 110px 100px; animation: spin 9s linear infinite reverse; }
  .orb .ostar { animation: twinkle 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .orb .ostar:nth-of-type(2n) { animation-delay: -1.3s; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes glow { 0%, 100% { opacity: .65; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.06); } }
  /* 구슬 양옆으로 펼친 카드 */
  .mini {
    position: absolute; left: 50%; bottom: 26px; width: 78px; height: 117px; margin-left: -39px; border-radius: 10px; border: 2px solid transparent;
    background:
      radial-gradient(circle at 50% 50%, rgba(255,214,120,.4) 0 13%, transparent 14%),
      radial-gradient(circle at 50% 50%, transparent 0 25%, rgba(255,214,120,.5) 26% 28%, transparent 29%),
      radial-gradient(circle at 50% 50%, transparent 0 34%, rgba(255,214,120,.25) 35% 36%, transparent 37%),
      repeating-linear-gradient(45deg, #34247a 0 6px, #291c60 6px 12px) padding-box,
      linear-gradient(135deg, #fff1b8, #c9922e 35%, #ffe7a0 55%, #a8741e) border-box;
    transform-origin: 50% 110%; transform: translateX(calc(var(--x) * var(--k, 1))) rotate(var(--r));
    box-shadow: 0 10px 24px rgba(0,0,0,.45); animation: bob 5s ease-in-out infinite; animation-delay: var(--d);
  }
  .mini::before { content: "☾"; position: absolute; inset: 0; display: grid; place-items: center; color: #ffd978; font-size: 20px; text-shadow: 0 0 8px rgba(255,210,110,.8); }
  .mini::after { content: ""; position: absolute; inset: 0; border-radius: 8px; background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.35) 50%, transparent 65%);
                 background-size: 300% 100%; animation: sheen 6s ease-in-out infinite; animation-delay: var(--d); }
  @keyframes bob { 0%, 100% { transform: translateX(calc(var(--x) * var(--k, 1))) rotate(var(--r)) translateY(0); } 50% { transform: translateX(calc(var(--x) * var(--k, 1))) rotate(var(--r)) translateY(-8px); } }
  @keyframes sheen { 0%, 60% { background-position: 150% 0; } 100% { background-position: -50% 0; } }
  .hero h1 { font-size: 70px; margin: 10px 0 0; letter-spacing: -1px; color: var(--gold); line-height: 1.1;
             background: linear-gradient(90deg, #e8c372, #fff3c4, #e8c372, #ffb3d1, #e8c372); background-size: 200% 100%;
             -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: gold 6s linear infinite;
             filter: drop-shadow(0 0 18px rgba(232,195,114,.45)); }
  @keyframes gold { to { background-position: -200% 0; } }
  .hero p { color: #c9bfe8; font-size: 21px; margin: 12px 0 0; }
  .chips { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
  .chips span { font-size: 15px; font-weight: 700; padding: 6px 14px; border-radius: 999px; color: #f3e6c4;
                background: rgba(232,195,114,.1); border: 1px solid rgba(232,195,114,.35); backdrop-filter: blur(4px); }

  /* 운세 버튼 */
  .topics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 30px; }
  .topic.love  { --c: #ff8fb8; --cg: rgba(255,143,184,.35); }
  .topic.study { --c: #7cc0ff; --cg: rgba(124,192,255,.35); }
  .topic.money { --c: #8fe0a0; --cg: rgba(143,224,160,.35); }
  .topic {
    position: relative; overflow: hidden; border-radius: 24px; color: var(--text); padding: 26px 16px 20px; text-align: center;
    border: 2px solid transparent;
    background:
      radial-gradient(120% 80% at 50% 0%, var(--cg), transparent 65%) padding-box,
      linear-gradient(170deg, #2a2158, #1a1438) padding-box,
      linear-gradient(140deg, var(--c), rgba(255,255,255,.15) 40%, var(--c)) border-box;
    box-shadow: 0 10px 28px rgba(0,0,0,.35);
    transition: transform .2s, box-shadow .2s;
  }
  .topic::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.18) 50%, transparent 65%);
    transform: translateX(-120%); transition: transform .6s;
  }
  .topic:hover { transform: translateY(-6px); box-shadow: 0 0 30px var(--cg), 0 14px 30px rgba(0,0,0,.4); }
  .topic:hover::after { transform: translateX(120%); }
  .topic .halo { position: relative; display: grid; place-items: center; width: 104px; height: 104px; margin: 0 auto; border-radius: 50%;
                 background: radial-gradient(circle, var(--cg), transparent 70%); box-shadow: 0 0 0 1px var(--cg) inset; }
  .topic .halo::before { content: ""; position: absolute; inset: -7px; border-radius: 50%; border: 1px dashed var(--c); opacity: .45; animation: spin 18s linear infinite; }
  .topic .ico { width: 60px; height: 60px; color: var(--c); filter: drop-shadow(0 0 10px var(--c)); animation: float 3.6s ease-in-out infinite; overflow: visible; }
  .topic .ico .fill { fill: var(--cg); }
  .topic .ico .tw { fill: #fff; animation: twinkle 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .topic.study .ico { animation-delay: -1.2s; } .topic.money .ico { animation-delay: -2.4s; }
  .topic .nm { font-size: 32px; font-weight: 900; display: block; margin-top: 8px; color: var(--c); text-shadow: 0 0 14px var(--cg); }
  .topic .ds { color: var(--muted); font-size: 17px; display: block; margin-top: 2px; }
  .topic .go { display: inline-block; margin-top: 14px; font-size: 16px; font-weight: 800; color: #1b1433; background: var(--c);
               padding: 7px 16px; border-radius: 999px; transition: transform .2s; }
  .topic:hover .go { transform: scale(1.06); }
  .note { text-align: center; color: var(--muted); font-size: 14px; margin: 26px auto 0; max-width: 640px;
          padding: 10px 16px; border-radius: 14px; border: 1px dashed var(--line); background: rgba(31,24,64,.5); }

  /* 카드 고르기 */
  .head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .pill { background: var(--panel2); border: 1px solid var(--topic); /* 예전 브라우저용 */
          background: color-mix(in srgb, var(--topic) 12%, #1f1840); border: 1px solid color-mix(in srgb, var(--topic) 50%, transparent);
          border-radius: 999px; padding: 8px 18px; font-weight: 800; color: var(--topic); box-shadow: 0 0 16px color-mix(in srgb, var(--topic) 25%, transparent); }
  .guide { text-align: center; margin: 22px 0 6px; font-size: 24px; font-weight: 800; }
  .guide small { display: block; font-size: 16px; color: var(--muted); font-weight: 500; margin-top: 6px; }
  .count { text-align: center; color: var(--topic); font-weight: 800; font-size: 20px; margin-bottom: 18px; }
  /* 카드 고르기 - 카드를 여러 줄의 부채꼴로 펼침 (위치는 JS 의 layoutDeck 이 계산) */
  .deck { position: relative; margin: 0 auto; }
  .back {
    position: absolute; left: 0; top: 0; width: var(--cw); height: calc(var(--cw) * 1.5);
    border-radius: 9px; border: 2px solid transparent; padding: 0;
    background:
      radial-gradient(circle at 50% 50%, rgba(255,214,120,.35) 0 14%, transparent 15%),
      radial-gradient(circle at 50% 50%, transparent 0 26%, rgba(255,214,120,.45) 27% 29%, transparent 30%),
      repeating-linear-gradient(45deg, #34247a 0 6px, #291c60 6px 12px) padding-box,
      linear-gradient(135deg, #fff1b8, #c9922e 35%, #ffe7a0 55%, #a8741e) border-box;
    overflow: hidden; box-shadow: -3px 4px 10px rgba(0,0,0,.45);
    transform-origin: 50% 100%;
    transform: translate(var(--x), var(--y)) rotate(var(--rot));
    transition: transform .25s cubic-bezier(.2,.8,.3,1.2), opacity .3s, box-shadow .2s, filter .3s;
    animation: deal .5s cubic-bezier(.2,.8,.3,1.2) both;
  }
  .back::before { content: "☾"; position: absolute; inset: 0; display: grid; place-items: center; color: #ffd978; font-size: calc(var(--cw) * .24); text-shadow: 0 0 8px rgba(255,210,110,.8); }
  .back::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.45) 50%, transparent 65%);
    transform: translateX(-120%); transition: transform .5s;
  }
  .back:hover:not(:disabled), .back:focus-visible { z-index: 200; transform: translate(var(--x), calc(var(--y) - 26px)) rotate(var(--rot)) scale(1.12);
                                                    box-shadow: 0 0 18px rgba(255,210,110,.8), 0 10px 24px rgba(0,0,0,.5); }
  .back:hover:not(:disabled)::after { transform: translateX(120%); }
  .back.chosen { z-index: 300; transform: translate(var(--x), calc(var(--y) - 40px)) rotate(var(--rot)) scale(1.16);
                 box-shadow: 0 0 0 3px var(--topic), 0 0 26px var(--topic), 0 12px 26px rgba(0,0,0,.5); }
  .back:disabled { cursor: default; }
  .back.dim { opacity: .28; filter: grayscale(.6); }
  /* 나눠 주는 애니메이션은 translate 속성만 써서 위치(transform)와 겹치지 않게 함 */
  @keyframes deal { from { opacity: 0; translate: 0 -60px; } to { opacity: 1; translate: 0 0; } }

  /* 결과 */
  .spread { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; margin-top: 22px; }
  .slot-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; min-width: 0; }
  .pos { font-weight: 800; color: var(--topic); font-size: 19px; }
  .slot { position: relative; width: 100%; max-width: 230px; aspect-ratio: 2 / 3; perspective: 1000px; cursor: pointer; border-radius: 16px; }
  .slot.open { cursor: default; }

  /* 카드 무늬별 색: s1 진한 색, s2 밝은 색, b1·b2 앞면 바탕 */
  [data-suit="major"]     { --s1: #6d3df0; --s2: #ffd36e; --b1: #fff8e6; --b2: #eedcff; }
  [data-suit="wands"]     { --s1: #e8501c; --s2: #ffc94d; --b1: #fff4e6; --b2: #ffd6bd; }
  [data-suit="cups"]      { --s1: #138fc4; --s2: #8fe6ff; --b1: #effbff; --b2: #c6ebff; }
  [data-suit="swords"]    { --s1: #4f5fcf; --s2: #cfd8ff; --b1: #f4f5ff; --b2: #d6dbfb; }
  [data-suit="pentacles"] { --s1: #178a4e; --s2: #f2cf5b; --b1: #f2fbea; --b2: #cfeec0; }

  /* 뒤집힐 때 카드 뒤로 퍼지는 빛 */
  .aura {
    position: absolute; inset: -18%; border-radius: 50%; pointer-events: none; z-index: 0; opacity: 0;
    background: radial-gradient(closest-side, var(--s2), var(--s1) 45%, transparent 75%);
    filter: blur(6px);
  }
  .slot.open .aura { animation: aura-in 1.4s ease-out .35s forwards, aura-pulse 3s ease-in-out 1.8s infinite; }
  @keyframes aura-in { 0% { opacity: 0; transform: scale(.6); } 40% { opacity: .95; transform: scale(1.1); } 100% { opacity: .5; transform: scale(1); } }
  @keyframes aura-pulse { 0%, 100% { opacity: .5; } 50% { opacity: .8; } }

  .flip { position: relative; z-index: 1; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .8s cubic-bezier(.3,.7,.2,1); }
  .slot.open .flip { transform: rotateY(180deg); }
  .slot:not(.open):hover .flip { transform: translateY(-6px) rotateY(-8deg); }
  .face, .cover { position: absolute; inset: 0; border-radius: 16px; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }

  /* 결과 카드 뒷면 */
  .cover {
    border: 4px solid transparent;
    background:
      radial-gradient(circle at 50% 44%, rgba(255,214,120,.35) 0 14%, transparent 15%),
      radial-gradient(circle at 50% 44%, transparent 0 24%, rgba(255,214,120,.5) 25% 26%, transparent 27%),
      radial-gradient(circle at 50% 44%, transparent 0 32%, rgba(255,214,120,.25) 33% 34%, transparent 35%),
      repeating-linear-gradient(45deg, #2e1f66 0 10px, #251a55 10px 20px) padding-box,
      linear-gradient(135deg, #fff1b8, #c9922e 35%, #ffe7a0 55%, #a8741e) border-box;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 18%;
    color: #ffd978; font-size: 15px; font-weight: 800; box-shadow: 0 10px 30px rgba(0,0,0,.45);
  }
  .cover .moon { position: absolute; top: 44%; left: 50%; transform: translate(-50%, -50%); font-size: 52px; text-shadow: 0 0 18px rgba(255,210,110,.9); }
  .cover .tw { position: absolute; color: #ffe9a8; font-size: 14px; animation: twinkle 2.4s ease-in-out infinite; }
  .slot:not(.open) .cover { animation: breathe 2.2s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { box-shadow: 0 10px 30px rgba(0,0,0,.45), 0 0 0 rgba(255,210,110,0); } 50% { box-shadow: 0 10px 30px rgba(0,0,0,.45), 0 0 26px rgba(255,210,110,.55); } }

  /* 결과 카드 앞면 - 금박 테두리, 무늬별 색, 빛나는 메달 */
  .face {
    transform: rotateY(180deg); transition: transform .7s cubic-bezier(.4,.1,.2,1); color: #2b2140;
    border: 4px solid transparent;
    background:
      radial-gradient(120% 70% at 50% 0%, rgba(255,255,255,.9), transparent 60%) padding-box,
      linear-gradient(165deg, var(--b1), var(--b2)) padding-box,
      linear-gradient(135deg, #fff1b8, #c9922e 30%, #fff4c7 50%, #b07a20 70%, #ffe7a0) border-box;
    box-shadow: 0 12px 34px rgba(0,0,0,.5);
  }
  /* 역방향: 앞면으로 뒤집힌 뒤 카드 전체가 180° 돌아 거꾸로 놓임 */
  .slot.turned .face { transform: rotateY(180deg) rotateZ(180deg); }
  .frame {
    position: absolute; inset: 7px; border-radius: 10px; border: 2px solid var(--s1); outline: 1px solid var(--s2); outline-offset: -6px;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 12px 6px 10px;
  }
  .corner { position: absolute; color: var(--s1); font-size: 13px; line-height: 1; }
  .corner.tl { top: 4px; left: 5px; } .corner.tr { top: 4px; right: 5px; }
  .corner.bl { bottom: 4px; left: 5px; } .corner.br { bottom: 4px; right: 5px; }
  .face .no {
    font-weight: 900; letter-spacing: 2px; font-size: 15px; color: #fff; padding: 3px 18px;
    background: linear-gradient(180deg, var(--s1), #2b2140); text-shadow: 0 1px 2px rgba(0,0,0,.4);
    clip-path: polygon(0 0, 100% 0, 92% 50%, 100% 100%, 0 100%, 8% 50%);
  }
  .medal { position: relative; width: 64%; aspect-ratio: 1; display: grid; place-items: center; }
  .medal::before {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle, #fff 0 35%, var(--b1) 60%, var(--b2) 100%);
    box-shadow: 0 0 0 3px var(--s2), 0 0 0 5px var(--s1), 0 0 22px var(--s1), inset 0 0 18px rgba(255,255,255,.9);
  }
  .rays {
    position: absolute; inset: -22%; border-radius: 50%;
    background: repeating-conic-gradient(var(--s2) 0 5deg, transparent 5deg 15deg);
    -webkit-mask-image: radial-gradient(circle, #000 35%, transparent 70%); mask-image: radial-gradient(circle, #000 35%, transparent 70%);
    opacity: .8; animation: spin 16s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .face .emo { position: relative; font-size: 58px; filter: drop-shadow(0 4px 6px rgba(0,0,0,.25)); }
  .slot.open .face .emo { animation: pop .7s cubic-bezier(.2,.9,.3,1.4) .45s both; }

  const last = word[word.length - 1];
  if (/[0-9]/.test(last)) return "0136789".includes(last) ? "이에요" : "예요";  // 영·일·삼·육·칠·팔 / 이·사·오·구
  const code = word.charCodeAt(word.length - 1) - 0xac00;
  return code >= 0 && code <= 11171 && code % 28 !== 0 ? "이에요" : "예요";
};

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function show(id) {
  document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("active", s.id === id));
  window.scrollTo(0, 0);
}

let state = null;

// ---------- 1. 운세 고르기 ----------
function chooseTopic(key) {
  const t = TOPICS[key];
  document.body.dataset.topic = key;
  state = { topic: key, deck: shuffle(CARDS.map((_, i) => i)), chosen: [] };
  $("pickTopic").textContent = `${t.emo} ${t.name}`;
  $("posGuide").textContent = t.positions.join(" → ");
  show("pick");
  renderDeck();
}

// ---------- 2. 카드 고르기 ----------
function renderDeck() {
  $("pickCount").textContent = `${state.chosen.length} / ${PICK}장 선택`;
  $("deck").innerHTML = "";
  state.deck.forEach((cardIdx, i) => {
    const b = document.createElement("button");
    b.className = "back";
    b.style.animationDelay = `${i * 0.012}s`;
    b.setAttribute("aria-label", `${i + 1}번째 카드`);
    b.onclick = () => chooseCard(b, cardIdx);
    $("deck").appendChild(b);
  });
  layoutDeck();
}

// 카드를 여러 줄의 부채꼴(가운데가 위로 볼록)로 겹쳐 펼침. 화면이 좁으면 줄 수를 늘림
function layoutDeck() {
  const deck = $("deck");
  const cards = [...deck.children];
  if (!cards.length) return;
  const W = Math.min(deck.parentElement.clientWidth, 1060);
  const rows = W < 520 ? 6 : W < 860 ? 4 : 3;
  const per = Math.ceil(cards.length / rows);
  const cw = Math.max(44, Math.min(92, W / (per * 0.42 + 1)));
  const ch = cw * 1.5, depth = cw * 0.45, rowGap = ch * 0.78 + depth * 0.4;
  const pad = cw * 0.35, top = 50;                         // 기울어진 끝 카드·뽑힌 카드가 밖으로 나가지 않게 여백
  deck.style.width = W + "px";
  deck.style.height = top + (rows - 1) * rowGap + ch + depth + 10 + "px";
  deck.style.setProperty("--cw", cw + "px");
  cards.forEach((b, i) => {
    const r = Math.floor(i / per), j = i % per;
    const n = Math.min(per, cards.length - r * per);
    const t = n > 1 ? (j / (n - 1)) * 2 - 1 : 0;           // 줄 안에서 -1(왼쪽) ~ 1(오른쪽)
    const step = n > 1 ? (W - cw - pad * 2) / (n - 1) : 0;
    b.style.setProperty("--x", pad + j * step + "px");
    b.style.setProperty("--y", top + r * rowGap + t * t * depth + "px");
    b.style.setProperty("--rot", t * 16 + "deg");
  });
}
window.addEventListener("resize", () => { if (state && $("pick").classList.contains("active")) layoutDeck(); });

function chooseCard(btn, cardIdx) {
  if (state.chosen.length >= PICK || btn.classList.contains("chosen")) return;
  btn.classList.add("chosen");
  btn.disabled = true;
  // 정방향 / 역방향은 고르는 순간 정해짐
  state.chosen.push({ idx: cardIdx, reversed: Math.random() < REV_RATE, open: false });
  $("pickCount").textContent = `${state.chosen.length} / ${PICK}장 선택`;
  if (state.chosen.length === PICK) {
    document.querySelectorAll(".back:not(.chosen)").forEach((b) => { b.disabled = true; b.classList.add("dim"); });
    setTimeout(showSpread, 700);
  }
}

// ---------- 3. 카드 펼치기 & 해석 ----------
function showSpread() {
  const t = TOPICS[state.topic];
  $("resTopic").textContent = `${t.emo} ${t.name}`;
  $("summary").hidden = true;
  $("endBtns").hidden = true;
  $("openAllBtn").hidden = false;
  $("spread").innerHTML = state.chosen.map((c, i) => {
    const card = CARDS[c.idx];
    return `<div class="slot-wrap" data-suit="${card.suit}">
      <div class="pos"><span class="pn">${i + 1}</span>${t.positions[i]}</div>
      <div class="slot" id="slot${i}" data-suit="${card.suit}" role="button" tabindex="0" aria-label="${t.positions[i]} 카드 뒤집기">
        <div class="aura"></div>
        <div class="flip">
          <div class="cover">
            <span class="moon">☾</span>
            <span class="tw" style="top:14%;left:18%">✦</span><span class="tw" style="top:20%;right:16%;animation-delay:.8s">✦</span>
            <span class="tw" style="bottom:28%;left:14%;animation-delay:1.4s">✧</span><span class="tw" style="bottom:22%;right:18%;animation-delay:.4s">✧</span>
            눌러서 뒤집기
          </div>
          <div class="face">
            <div class="frame">
              <span class="corner tl">✦</span><span class="corner tr">✦</span><span class="corner bl">✦</span><span class="corner br">✦</span>
              <div class="no">${card.no}</div>
              <div class="medal"><div class="rays"></div><div class="emo">${card.emo}</div></div>
              <div class="plate">
                <div class="suit">${SUIT_LABEL[card.suit]}</div>
                <div class="nm${card.name.length > 5 ? " long" : ""}">${card.name}</div>
                <div class="en">${card.en}</div>
              </div>
            </div>
            <div class="shine"></div>
          </div>
        </div>
      </div>
      <div class="orient" id="orient${i}"></div>
      <div class="reading" id="reading${i}"><div class="tap">👆 카드를 눌러 주세요</div></div>
    </div>`;
  }).join("");
  state.chosen.forEach((_, i) => {
    $("slot" + i).onclick = () => openCard(i);
    $("slot" + i).onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openCard(i); } };
  });
  show("result");
}

// 카드 열기: ① 앞면으로 뒤집기(0.8초) → ② 역방향이면 카드가 180° 돌아 거꾸로 놓임(0.7초) → ③ 해석 표시
const FLIP_MS = 800, TURN_MS = 700;

function openCard(i) {
  const c = state.chosen[i];
  if (c.open) return;
  c.open = true;
  const slot = $("slot" + i);
  slot.classList.add("open");
  slot.setAttribute("aria-disabled", "true");
  const sc = getComputedStyle(slot);
  setTimeout(() => burst(slot, 20, [sc.getPropertyValue("--s1"), sc.getPropertyValue("--s2"), "#fff3c4", "#ffd36e"]), FLIP_MS * 0.45);
  if (c.reversed) setTimeout(() => slot.classList.add("turned"), FLIP_MS);
  setTimeout(() => showReading(i), c.reversed ? FLIP_MS + TURN_MS : FLIP_MS * 0.6);
}

function showReading(i) {
  const c = state.chosen[i];
  const card = CARDS[c.idx];
  const d = c.reversed ? 1 : 0;
  const orient = $("orient" + i);
  orient.className = "orient show " + (c.reversed ? "rev" : "up");
  orient.textContent = c.reversed ? "🔄 역방향 · 카드가 거꾸로 나왔어요" : "⬆️ 정방향";
  $("reading" + i).classList.add("done");
  $("reading" + i).innerHTML =
    `<div class="title"><span class="badge-emo">${card.emo}</span>${card.name}<span class="dir ${c.reversed ? "rev" : "up"}">${c.reversed ? "역방향" : "정방향"}</span></div>` +
    `<div class="kws">${card.key[d].split(", ").map((k) => `<span>${k}</span>`).join("")}</div>` +
    `<div class="msg">${card[state.topic][d]}</div>` +
    (c.reversed
      ? `<div class="revnote">🔄 역방향은 카드의 뜻이 약해지거나 반대로 바뀐다는 의미예요. (정방향일 때: ${card.key[0]})</div>`
      : "");
  c.done = true;
  if (state.chosen.every((x) => x.done)) showSummary();
}

// 별가루 터뜨리기: el 가운데에서 n개의 별이 사방으로 퍼짐
function burst(el, n, colors) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  for (let k = 0; k < n; k++) {
    const s = document.createElement("span");
    const ang = Math.random() * Math.PI * 2, dist = 70 + Math.random() * 110;
    s.className = "spark";
    s.textContent = randomOf(["✦", "★", "✧", "•"]);
    s.style.setProperty("--dx", `${Math.cos(ang) * dist}px`);
    s.style.setProperty("--dy", `${Math.sin(ang) * dist}px`);
    s.style.setProperty("--rot", `${Math.random() * 360}deg`);
    s.style.setProperty("--sz", `${10 + Math.random() * 16}px`);
    s.style.setProperty("--c", randomOf(colors).trim() || "#ffd36e");
    el.appendChild(s);
    setTimeout(() => s.remove(), 1100);
  }
}

function openAll() {
  state.chosen.forEach((_, i) => setTimeout(() => openCard(i), i * 350));
}

// ---------- 4. 종합 운세 ----------
function showSummary() {
  const t = TOPICS[state.topic];
  const scores = state.chosen.map((c) => CARDS[c.idx].score[c.reversed ? 1 : 0]);
  const total = scores.reduce((a, b) => a + b, 0);
  const fives = scores.filter((x) => x === 5).length;
  // 0~3개: 점수 합계가 STAR_CUTS 의 기준을 넘을 때마다 별 1개
  let stars = STAR_CUTS.filter((cut) => total > cut).length;
  // 4~5개: 5점 카드 수 + 합계 조건
  if (fives >= STAR4[0] && total >= STAR4[1]) stars = 4;
  if (fives >= STAR5[0] && total >= STAR5[1]) stars = 5;
  const tier = stars <= 1 ? 0 : stars <= 3 ? 1 : 2;
  const revCount = state.chosen.filter((c) => c.reversed).length;
  const best = state.chosen.reduce((a, c) => (CARDS[c.idx].score[c.reversed ? 1 : 0] > CARDS[a.idx].score[a.reversed ? 1 : 0] ? c : a));
  const bestCard = CARDS[best.idx];
  const color = randomOf(t.lucky_colors);
  $("summary").innerHTML =
    `<span class="cn tl">✦</span><span class="cn tr">✦</span><span class="cn bl">✦</span><span class="cn br">✦</span>` +
    `<div class="sum-ico">${TOPIC_ICON[state.topic]}</div>` +
    `<div class="sum-sub">TODAY'S FORTUNE</div>` +
    `<h2>오늘의 ${t.name}</h2>` +
    `<div class="stars" aria-label="별 5개 중 ${stars}개">` +
      [0, 1, 2, 3, 4].map((k) => `<span class="st ${k < stars ? "on" : ""}" style="animation-delay:${0.2 + k * 0.18}s">${k < stars ? "★" : "☆"}</span>`).join("") +
    `</div>` +
    `<div class="star-meta"><span class="num">${stars} / 5</span>${stars === 5 ? `<span class="badge">✨ 대박 운세!</span>` : stars === 4 ? `<span class="badge">🍀 아주 좋아요</span>` : ""}</div>` +
    `<div class="divider">✦ ☾ ✦</div>` +
    `<div class="quote">${t.summary[tier]}</div>` +
    ((stars === 0 || revCount) ? `<div class="notes">` +
      (stars === 0 ? `<p>🌱 별이 하나도 없는 날은 아주 드물어요! 오늘이 바닥이라면 내일부터는 올라갈 일만 남았다는 뜻이에요.</p>` : "") +
      (revCount ? `<p>🔄 거꾸로 나온 카드가 <b>${revCount}장</b> 있어요. 역방향 카드의 말은 '조심하면 좋아진다'는 신호로 받아들이세요.</p>` : "") +
    `</div>` : "") +
    `<div class="best" data-suit="${bestCard.suit}"><span class="badge-emo">${bestCard.emo}</span>` +
      `<div><small>가장 힘이 되는 카드</small><b>${bestCard.name}</b><span>${bestCard.key[best.reversed ? 1 : 0]}의 기운을 기억하세요.</span></div></div>` +
    `<div class="lucky">` +
      `<div><div class="lk-ico swatch" style="--sw:${COLOR_HEX[color] || "#ffd36e"}"></div><b>행운의 색</b><span class="val">${color}</span></div>` +
      `<div><div class="lk-ico coin">${1 + Math.floor(Math.random() * 9)}</div><b>행운의 숫자</b><span class="val">오늘의 숫자</span></div>` +
      `<div><div class="lk-ico gift">🎁</div><b>행운의 아이템</b><span class="val">${randomOf(t.lucky_items)}</span></div>` +
    `</div>`;
  $("summary").classList.toggle("jackpot", stars === 5);
  $("summary").hidden = false;
  if (stars >= 4) setTimeout(() => burst($("summary"), stars === 5 ? 40 : 22, ["#ffd36e", "#ff8fb8", "#8fe6ff", "#b9a4ff", "#9ff0b0"]), 300);
  $("endBtns").hidden = false;
  $("openAllBtn").hidden = true;
  setTimeout(() => $("summary").scrollIntoView({ behavior: "smooth", block: "nearest" }), 200);
}

// ---------- 시작 ----------
function init() {
  $("topics").innerHTML = Object.entries(TOPICS).map(([k, t]) =>
    `<button class="topic ${k}" data-key="${k}"><span class="halo">${TOPIC_ICON[k]}</span><span class="nm">${t.name}</span><span class="ds">${t.desc}</span><span class="go">카드 뽑기 →</span></button>`
  ).join("");
  document.querySelectorAll(".topic").forEach((b) => { b.onclick = () => chooseTopic(b.dataset.key); });
  $("backBtn").onclick = () => show("start");
  $("homeBtn").onclick = () => { delete document.body.dataset.topic; show("start"); };
  $("againBtn").onclick = () => chooseTopic(state.topic);
  $("openAllBtn").onclick = openAll;
}
init();
</script>
